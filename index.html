<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melting-pot · Mission 4 h</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Salle des missions : barre de contrôle fixe, tableau de 6 missions, dossiers de mission en colonne de lecture */
:root{
  --bg:#eceff5; --panel:#fff; --ink:#131c33; --muted:#5b6782; --line:#d4dae6; --soft:#f5f7fb;
  --navy:#1b2f5e; --eco:#0f6e6a; --atelier:#b06a10; --refl:#7a3a73; --accent:#2c4fb8; --ok:#1d7a46; --warn:#b3261e;
  --f-d:"Bricolage Grotesque","DejaVu Sans",system-ui,sans-serif; --f-b:"Archivo","DejaVu Sans",system-ui,sans-serif; --f-m:"JetBrains Mono","DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1322;--panel:#151d31;--ink:#e5eaf4;--muted:#9ba7c1;--line:#2a3550;--soft:#1b2540;--navy:#93abea;--eco:#4fc2bb;--atelier:#e4a24a;--refl:#d18ccb;--accent:#8aa4ff;--ok:#5fcf8c;--warn:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1322;--panel:#151d31;--ink:#e5eaf4;--muted:#9ba7c1;--line:#2a3550;--soft:#1b2540;--navy:#93abea;--eco:#4fc2bb;--atelier:#e4a24a;--refl:#d18ccb;--accent:#8aa4ff;--ok:#5fcf8c;--warn:#ff8a80;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-b);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--panel);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar .brand{font:800 20px/1 var(--f-d);letter-spacing:-.01em}
.bar .brand small{display:block;font:500 11px var(--f-m);letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:3px}
.bar .stats{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stat{font:700 15px var(--f-m)} .stat span{display:block;font:500 10px var(--f-m);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.stat.alert{color:#ffb4ab}
.bar .btn{background:var(--panel);color:var(--navy);border:0}
main{max-width:1060px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 80px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 18px;min-height:44px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);color:var(--panel);border-color:var(--navy)}
.btn.danger{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:var(--f-d);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,48px);line-height:1.05;font-weight:800}
h2{font-size:26px;font-weight:800}
.lead{color:var(--muted);max-width:65ch}
.eyebrow{font:600 12px var(--f-m);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* Accueil */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:20px}
.gbtn{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:72px}
.gbtn:hover{border-color:var(--navy);transform:translateY(-2px)}
.gbtn b{display:block;font:700 13px var(--f-m);color:var(--muted)}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:18px 0}
.rules ol{margin:8px 0 0;padding-left:22px} .rules li{margin:6px 0}
.rules .hot{color:var(--warn);font-weight:600}
label.check{display:flex;gap:10px;align-items:center;margin:14px 0}
label.check input{width:22px;height:22px}
input[type=text],textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;line-height:1.5}

/* Tableau des missions */
.board-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:end;margin-bottom:18px}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:220px;flex:1;max-width:360px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .4s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--c)}
.card .top{background:var(--c);color:var(--panel);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font:700 13px var(--f-m)}
.card .body{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:19px}
.card .role{color:var(--muted);font-size:14px}
.card .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font:600 12px var(--f-m);color:var(--muted)}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font:600 11px var(--f-m);border:1px solid currentColor}
.chip.done{color:var(--ok)} .chip.part{color:var(--atelier)} .chip.todo{color:var(--muted)}

/* Mission */
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;min-height:44px}
.mhead{border-left:6px solid var(--c);padding:4px 0 4px 16px;margin:6px 0 18px}
.mhead .src{font:700 12px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.mhead .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font:600 13px var(--f-m);margin-top:8px}
.brief{background:var(--soft);border:1px dashed var(--c);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.brief .who{font:700 12px var(--f-m);text-transform:uppercase;letter-spacing:.08em;color:var(--c);margin-bottom:6px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px 14px;margin-bottom:22px;overflow-x:auto}
.doc h4{font:700 15px var(--f-d);margin:14px 0 8px}
.doc table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;min-width:420px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--soft);font-weight:600}
.doc .src{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.doc ul,.doc ol{margin:6px 0;padding-left:22px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.item .ih{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.item .kind{font:700 12px var(--f-m);text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.item .pts{font:700 12px var(--f-m);background:var(--soft);border-radius:99px;padding:3px 10px}
.item .q{font-weight:600;margin:0 0 12px}
.item.answered{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:var(--panel);text-align:left}
.opt input{width:20px;height:20px;margin-top:2px;flex:none}
.opt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--panel))}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.row:last-child{border-bottom:0}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;min-height:40px;font-size:14px}
.seg button.on{background:var(--c);border-color:var(--c);color:var(--panel)}
.ord{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel)}
.ord b{font:700 14px var(--f-m);color:var(--c);width:24px}
.ord span{flex:1}
.ord button{border:1px solid var(--line);background:var(--soft);border-radius:8px;width:40px;height:40px}
.numf{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.numf input{text-align:right;font-family:var(--f-m)}
.numf .u{font:500 13px var(--f-m);color:var(--muted);min-width:60px}
@media (max-width:640px){.numf{grid-template-columns:1fr 1fr}.numf label{grid-column:1/-1}}
.fill{line-height:2.4}
.fill select{width:auto;display:inline-block;min-height:38px;padding:4px 8px;margin:0 3px;border-color:var(--c)}
.tfrow{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.tfrow:last-child{border-bottom:0}
.count{font:500 12px var(--f-m);color:var(--muted);text-align:right;margin-top:4px}
.mt label{display:block;font-weight:600;margin:10px 0 6px}
.mnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* Surcouches */
.veil{position:fixed;inset:0;z-index:50;background:rgba(10,14,28,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.veil .box{background:var(--panel);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:26px;text-align:center}
.big{font:800 72px/1 var(--f-m);color:var(--warn);margin:12px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:10px;font-weight:600;max-width:90vw}
.lock .box{text-align:left}
.lock h2{color:var(--warn)}
.fsbanner{background:var(--atelier);color:#fff;text-align:center;padding:8px 12px;font-weight:600}
.fsbanner button{margin-left:10px;background:#fff;color:var(--atelier);border:0;border-radius:6px;padding:4px 10px}
/* Rôles */
.roles{background:var(--panel);border:2px solid var(--c);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.roles h3{font-size:17px;margin-bottom:4px}
.roles .rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.roles label{font:600 12px var(--f-m);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.roles .err{color:var(--warn);font-weight:600;margin-top:8px}
.roles.ok{border-style:dashed}
.gate{opacity:.35;pointer-events:none;filter:grayscale(.6)}
/* Indices et vérification */
.hintbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.hbtn{border:1px dashed var(--atelier);color:var(--atelier);background:var(--panel);border-radius:8px;padding:7px 12px;min-height:40px;font-weight:600;font-size:14px}
.hbtn.confirm{background:var(--atelier);color:#fff;border-style:solid}
.hint{background:color-mix(in srgb,var(--atelier) 12%,var(--panel));border-left:4px solid var(--atelier);border-radius:0 8px 8px 0;padding:8px 12px;font-size:14.5px;flex:1 1 100%}
.verify{background:var(--panel);border:2px solid var(--c);border-radius:14px;padding:16px 18px;margin-top:18px}
.verify .res{font:700 18px var(--f-d);margin-top:8px}
.verify .res.good{color:var(--ok)} .verify .res.bad{color:var(--warn)}
.card.locked{opacity:.6} .card.locked .top{background:var(--muted)}
/* Flash */
.flash .box{max-width:760px;text-align:left;max-height:90vh;overflow:auto;padding:0}
.flash .ticker{background:var(--warn);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:800 15px var(--f-m);letter-spacing:.12em;position:sticky;top:0;z-index:2}
.flash .ticker b{font-size:22px;letter-spacing:0}
.flash .fbody{padding:18px 22px}
.flash .news{font:600 19px/1.4 var(--f-d);margin:6px 0 16px}
.flash .item{--c:var(--warn)}
.pill{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--warn);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:700 15px var(--f-m);box-shadow:0 6px 20px rgba(0,0,0,.25)}
@keyframes blink{50%{opacity:.55}} .flash .ticker span{animation:blink 1.2s infinite}
/* Certitude */
.cert{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font:600 12px var(--f-m);color:var(--muted)}
.cert button{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;min-height:36px;font:600 13px var(--f-b)}
.cert button.on[data-c="s"]{background:var(--ok);border-color:var(--ok);color:#fff}
.cert button.on[data-c="h"]{background:var(--atelier);border-color:var(--atelier);color:#fff}
.cert button.on[data-c="d"]{background:var(--muted);border-color:var(--muted);color:#fff}
/* Coffre, messagerie, palier, audit */
.vault{background:var(--panel);border:2px solid var(--refl);border-radius:14px;padding:16px 18px;margin:18px 0}
.vault .digits{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.vault .digits input{width:52px;height:60px;text-align:center;font:800 26px var(--f-m);padding:0}
.vault ol{margin:6px 0;padding-left:22px;font-size:14px}
.vault.open{border-style:dashed}
.msgs{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:44;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.msg{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:14.5px;animation:slidein .35s ease-out}
.msg b{display:flex;justify-content:space-between;gap:8px;font:700 12px var(--f-m);text-transform:uppercase;letter-spacing:.06em;color:var(--navy)}
.msg button{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;min-height:auto;padding:0 4px}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}}
.palier{background:var(--soft);color:var(--ink);border-radius:8px;padding:4px 10px;font:700 12px var(--f-m)}
.auditbar{background:var(--refl);color:#fff;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
.auditbar button{background:#fff;color:var(--refl);border:0;border-radius:8px;padding:8px 12px;font-weight:700}
.audit{background:var(--panel);border:2px solid var(--refl);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.audit label.check{margin:6px 0}
.inbox{margin-top:22px}
.inbox li{margin:6px 0;font-size:14px}
.net{font:600 11px var(--f-m);opacity:.85}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.ptabs button{border:0;background:none;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;min-height:44px}
.ptabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.proj{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.proj{grid-template-columns:minmax(0,1fr)}}
.proj .pl{text-align:center;padding:20px}
.pclock{font:800 clamp(64px,11vw,170px)/1 var(--f-m);letter-spacing:-.04em;margin:8px 0 18px;font-variant-numeric:tabular-nums}
.pclock.low{color:var(--warn)}
.ppal{display:inline-block;font:800 clamp(20px,2.4vw,32px) var(--f-d);padding:10px 22px;border-radius:12px;border:2px solid var(--atelier);color:var(--atelier)}
.pfeed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pfeed li{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px}
.pfeed time{font:600 13px var(--f-m);color:var(--muted)} .pfeed b{display:block;font:800 21px var(--f-d)} .pfeed p{margin:4px 0 0;color:var(--muted)}
.prof{margin-top:30px;color:var(--muted);font-size:13px}
.prof summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="fsb" class="fsbanner" hidden>Restez en plein écran pendant la mission.<button id="fsbtn">Revenir en plein écran</button></div>
<header class="bar" id="bar" hidden>
  <div class="brand">Melting-pot<small id="bGroup"></small><small class="net" id="net"></small></div>
  <div class="stats">
    <div class="stat" id="sTime">4:00:00<span>Temps restant</span></div>
    <div class="stat"><span class="palier" id="sPal">Cours autorisés</span><span>Supports</span></div>
    <div class="stat" id="sProg">0 %<span>Progression</span></div>
    <div class="stat" id="sExit">0<span>Sorties</span></div>
    <div class="stat" id="sHint">0<span>Indices</span></div>
    <div class="stat" id="sFlash">0/3<span>Flashs</span></div>
    <button class="btn" id="bBoard">Tableau des missions</button>
  </div>
</header>
<main id="app"></main>
<div id="veil"></div>
<div id="toast" class="toast" hidden></div>
<div id="msgs" class="msgs" aria-live="polite"></div>

f8a80;--kobg:#3a1715;--mid:#f0b45a;--midbg:#3a2a10;--accent:#8aa4ff;color-scheme:dark}}\n*{box-sizing:border-box} html,body{margin:0}\nbody{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-b)}\nbutton,input{font:inherit;color:inherit}\nheader{background:var(--navy);color:var(--panel);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}\nheader h1{font:800 22px var(--f-d);margin:0}\n.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px}\n.settings input{width:64px;padding:5px 6px;border-radius:6px;border:0;color:#111}\n.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:18px 20px;max-width:1500px;margin:0 auto}\n@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}\n.side{display:flex;flex-direction:column;gap:12px}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}\n.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}\n.drop.over{border-color:var(--accent);background:var(--soft)}\n.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}\n.btn.primary{background:var(--navy);color:var(--panel);border-color:var(--navy)}\n.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}\n.glist li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 11px;cursor:pointer}\n.glist li button.on{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--navy)}\n.glist b{display:flex;justify-content:space-between;font-family:var(--f-m);font-size:13px}\n.glist small{color:var(--muted)}\n.tag{display:inline-block;font:600 11px var(--f-m);border-radius:99px;padding:2px 8px}\n.tag.ok{background:var(--okbg);color:var(--ok)} .tag.ko{background:var(--kobg);color:var(--ko)} .tag.mid{background:var(- ité par sortie <input type=\"number\" id=\"pen\" step=\"0.25\" min=\"0\" value=\"0.5\"> pt<\/label>\n    <label>Ignorer les sorties de moins de <input type=\"number\" id=\"thr\" step=\"0.5\" min=\"0\" value=\"2\"> s<\/label>\n    <label>Pénalité de verrouillage <input type=\"number\" id=\"lockpen\" step=\"0.5\" min=\"0\" value=\"0\"> pt<\/label>\n  <\/div>\n<\/header>\n<div class=\"wrap\">\n  <aside class=\"side\">\n    <div class=\"panel\">\n      <div class=\"drop\" id=\"drop\">Glissez ici les fichiers JSON des groupes<br>ou<br><label class=\"btn\" style=\"display:inline-block;margin-top:8px\">Choisir des fichiers<input type=\"file\" id=\"file\" accept=\".json,application/json\" multiple hidden><\/label><\/div>\n    <\/div>\n    <div class=\"panel\"><ul class=\"glist\" id=\"glist\"><li class=\"empty\" style=\"padding:10px\">Aucun fichier chargé.<\/li><\/ul><\/div>\n    <div class=\"panel\"><b>Séance en ligne<\/b><p style=\"margin:6px 0;font-size:13px;color:var(--muted)\">Code et mot de passe de la salle de crise.<\/p>\n      <input id=\"scode\" placeholder=\"Code de séance\" style=\"width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-transform:uppercase\"><input id=\"ssec\" type=\"password\" placeholder=\"Mot de passe professeur\" style=\"width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-top:6px\">\n      <div class=\"actions\"><button class=\"btn primary\" id=\"simport\">Actualiser les travaux<\/button><\/div><div id=\"sout\" style=\"font-size:13px;margin-top:6px\"><\/div><\/div>\n    <div class=\"panel actions\" style=\"margin:0\"><button class=\"btn\" id=\"overview\">Vue d'ensemble (carte des erreurs)<\/button><\/div>\n\n    <div class=\"panel actions\" style=\"margin:0\"><button class=\"btn\" id=\"bilan\">Imprimer le bilan du groupe<\/button><button class=\"btn\" id=\"csv\">Exporter les notes (CSV)<\/button><button class=\"btn\" id=\"print\">Imprimer la correction )}<\/ul>`;\n    case \"fill\": return `<ul>${it.blanks.map((b, k) => `<li>${mk(a[b.id] === it.ans[b.id])} Choix ${k + 1} : <b>${esc(a[b.id] || \"—\")}<\/b><\/li>`).join(\"\")}<\/ul>`;\n    case \"tf\": return `<ul>${it.stmts.map(s => `<li>${mk(a[s.id]?.v === it.ans[s.id])} ${esc(s.t)} → <b>${a[s.id]?.v == null ? \"—\" : a[s.id].v ? \"Vrai\" : \"Faux\"}<\/b><br><small>Justification : ${esc(a[s.id]?.j || \"aucune\")}<\/small><\/li>`).join(\"\")}<\/ul>`;\n    case \"text\": return `<div class=\"ans\">${esc(a)}<\/div><small>${String(a).trim().split(/\\s+/).filter(Boolean).length} mots<\/small>`;\n    case \"multitext\": return it.fields.map(f => `<p><b>${esc(f.label)}<\/b><br><span class=\"ans\">${esc(a[f.id] || \"—\")}<\/span><\/p>`).join(\"\");\n  }\n}\nfunction showExpected(it) {\n  switch (it.type) {\n    case \"qcm\": return esc(it.opts.find(o => o.id === it.ans).t);\n    case \"multi\": return `<ul>${it.ans.map(id => `<li>${esc(it.opts.find(o => o.id === id).t)}<\/li>`).join(\"\")}<\/ul>`;\n    case \"classify\": return it.cats.map((c, ci) => `<p><b>${esc(c)}<\/b> : ${it.items.filter(x => it.ans[x.id] === ci).map(x => esc(x.t)).join(\" ; \")}<\/p>`).join(\"\");\n    case \"match\": return `<ul>${it.left.map(l => `<li>${esc(l.t)} → ${esc(it.right.find(r => r.id === it.ans[l.id]).t)}<\/li>`).join(\"\")}<\/ul>`;\n    case \"order\": return `<ol>${it.ans.map(id => `<li>${esc(it.items.find(x => x.id === id).t)}<\/li>`).join(\"\")}<\/ol>`;\n    case \"num\": return `<ul>${it.fields.map(f => `<li>${esc(f.label)} : <b>${fr(it.ans[f.id].v, 3)}<\/b> ${esc(f.unit)} <small>(tolérance ± ${fr(it.ans[f.id].tol, 3)})<\/small><\/li>`).join(\"\")}<\/ul>`;\n    case \"fill\": return `<ul>${it.blanks.map((b, k) => `<li>Choix ${k + 1} : <b>${esc(it.ans[b.id])}<\/b><\/li>`).join(\"\")}<\/ul>`;\n    case \"tf\": return `<ul>${it.stmts.map(s => `<li>${esc(s.t)} → <b>${it.ans[s.id] ? \"Vrai\" : \"Faux\"}<\/b><\/li>`).join(\"\")}<\/ul>`;\n    default: return \"Voir la grille de correction ci-dessous.\";\n  }\n}\n\n/* ---------- Rapport du groupe ---------- */\nfunction renderGroup() {\n  const f = files.find(x => x.key === cur); if (!f) return;\n  const sc = scoreFile(f), st = store.get(f.key), p = f.p, s = settings();\n  const dur = p.startedAt && (p.submittedAt || p.lockedAt || p.exportedAt) ? Math.round((new Date(p.submittedAt || p.lockedAt || p.exportedAt) - new Date(p.startedAt)) / 60000) : null;\n  const t = d => d ? new Date(d).toLocaleString(\"fr-FR\", { dateStyle: \"short\", timeStyle: \"short\" }) : \"—\";\n  $(\"#main\").innerHTML = `<div class=\"panel\">\n    <div class=\"head\"><div><div class=\"k\" style=\"font:700 12px var(--f-m);color:var(--muted)\">${p.group}<\/div><h2>${esc(p.members)}<\/h2>\n      <div class=\"kv\"><div><span>Début :<\/span> ${t(p.startedAt)}<\/div><div><span>Fin :<\/span> ${t(p.submittedAt || p.lockedAt)}<\/div><div><span>Durée :<\/span> ${dur != null ? Math.floor(dur / 60) + \" h \" + String(dur % 60).padStart(2, \"0\") : \"—\"}<\/div>\n      <div><span>Statut :<\/span> <span class=\"tag ${p.status === \"rendu\" ? \"ok\" : p.status === \"en cours\" ? \"mid\" : \"ko\"}\">${esc(p.status)}<\/span><\/div><div><span>Intégrité :<\/span> ${f.sigOk ? '<span class=\"tag ok\">fichier authentique<\/span>' : '<span class=\"tag ko\">fichier modifié après export<\/span>'}<\/div>\n      <div><span>Déverrouillages :<\/span> ${(p.unlocks || []).length}<\/div><\/div><\/div>\n      <div class=\"score\"><div class=\"note\">${fr(sc.final)}<\/div><small>/ 20<\/small><small>Brut ${fr(sc.raw)} · sorties −${fr(sc.pen)} · indices −${fr(sc.hint)}${sc.oral ? ` · oral ${sc.oral > 0 ? \"+\" : \"\"}${fr(sc.oral)}` : \"\"}<\/small><\/div><\/div>\n    <details ${p.exits?.length ? \"open\" : \"\"}><summary><b>Sorties : ${(p.exits || []).length} enregistrée(s), ${sc.counted} comptée(s)<\/b> (seuil ${fr(s.thr)} s, ${fr(s.pen)} pt par sortie)<\/summary>\n      ${(p.exits || []).length ? `<table class=\"ex\"><tr><th>Heure<\/th><th>Durée<\/th><th>Comptée<\/th><\/tr>${p.exits.map(e => `<tr><td>${new Date(e.at).toLocaleTimeString(\"fr-FR\")}<\/td><td>${fr(e.dur, 1)} s${e.reload ? \" (page fermée ou rechargée)\" : \"\"}<\/td><td>${e.dur >= s.thr ? '<span class=\"bad\">oui<\/span>' : \"non\"}<\/td><\/tr>`).join(\"\")}<\/table>` : \"<p>Aucune sortie.<\/p>\"}<\/details>\n    ${calibHtml(sc.g, p)}\n    <p style=\"font-size:14px\"><b>Coffre :<\/b> ${p.vault?.opened ? `ouvert à ${new Date(p.vault.opened).toLocaleTimeString(\"fr-FR\")} (code ${esc(sc.g.vaultCode)})` : \"non ouvert\"}${p.vault?.attempts?.length ? ` · ${p.vault.attempts.length} essai(s) faux` : \"\"} · <b>Messages reçus :<\/b> ${(p.messages || []).length}<\/p>\n    <details ${(p.pastes || []).some(x => x.len > 80) ? \"open\" : \"\"}><summary><b>Collages : ${(p.pastes || []).length}<\/b>${(p.pastes || []).some(x => x.len > 80) ? ' <span class=\"flag\">dont au moins un texte long collé<\/span>' : \"\"}<\/summary>\n      ${(p.pastes || []).length ? `<table class=\"ex\"><tr><th>Heure<\/th><th>Épreuve<\/th><th>Caractères<\/th><\/tr>${p.pastes.map(x => `<tr><td>${new Date(x.at).toLocaleTimeString(\"fr-FR\")}<\/td><td>${esc(itemLabel(sc.g, x.item))}<\/td><td class=\"${x.len > 80 ? \"flag\" : \"\"}\">${x.len}<\/td><\/tr>`).join(\"\")}<\/table>` : \"<p>Aucun collage.<\/p>\"}<\/details>\n    <details><summary><b>Indices achetés : ${Object.keys(p.hints || {}).length}<\/b> (−${fr(sc.hint)} pt) · <b>Vérifications : ${Object.keys(p.verifications || {}).length}<\/b><\/summary>\n      <ul>${Object.keys(p.hints || {}).map(id => `<li>${esc(itemLabel(sc.g, id))} : −${fr(HINTS[id] ?? 0)} pt<\/li>`).join(\"\")}<\/ul>\n      <ul>${Object.entries(p.verifications || {}).map(([mid, v]) => `<li>${esc(sc.g.missions.find(m => m.id === mid)?.title)} : ${v.errors} erreur(s) sur ${v.total} à ${new Date(v.at).toLocaleTimeString(\"fr-FR\")}<\/li>`).join(\"\")}<\/ul><\/details>\n    <div class=\"bars\">${sc.per.map((x, i) => `<button class=\"bar\" data-go=\"${x.m.id}\"><span>${i + 1}. ${esc(x.m.title)}<\/span><b>${fr(x.s)} / ${fr(x.m.pts)}<\/b><i><em style=\"width:${x.s / x.m.pts * 100}%\"><\/em><\/i><small>${p.missionMinutes?.[x.m.id] != null ? fr(p.missionMinutes[x.m.id], 0) + \" min\" : \"\"}<\/small><\/button>`).join(\"\")}<button class=\"bar\" data-go=\"${sc.g.id}flashes\"><span>Flashs « Dernière minute »<\/span><b>${fr(sc.fl.reduce((t, x) => t + x.s, 0))} / 1,5<\/b><i><em style=\"width:${sc.fl.reduce((t, x) => t + x.s, 0) / 1.5 * 100}%\"><\/em><\/i><\/button><\/div>\n  <\/div>\n  ${sc.g.missions.map((m, mi) => `<section class=\"mission\" id=\"m_${m.id}\"><h3><span>Mission ${mi + 1} · ${esc(m.title)}<\/span><span>${fr(sc.per[mi].s)} / ${fr(m.pts)}<\/span><\/h3><div class=\"sub\">${esc(m.src)} · rôle : ${esc(m.role)}${p.redacteurs?.[m.id] ? ` · <b>Rédigée par :<\/b> ${esc(p.redacteurs[m.id])}` : \"\"}${p.verifications?.[m.id] ? ` · vérification : ${p.verifications[m.id].errors} erreur(s) signalée(s)` : \"\"}<\/div>\n    ${m.items.map((it, ii) => itemHtml(it, ii, p.answers[it.id], st, p)).join(\"\")}<\/section>`).join(\"\")}\n  <section class=\"mission\" id=\"m_${sc.g.id}flashes\"><h3><span>Flashs « Dernière minute »<\/span><span>${fr(sc.fl.reduce((t, x) => t + x.s, 0))} / 1,5<\/span><\/h3>\n  ${sc.g.flashes.map((fl, k) => `<div class=\"sub\"><b>Flash ${k + 1} (${fl.at} min) · ${esc(fl.title)}<\/b> — ${esc(fl.news)} ${p.flashes?.[fl.id] ? `<br>Reçu à ${new Date(p.flashes[fl.id].startedAt).toLocaleTimeString(\"fr-FR\")}` : '<br><span class=\"flag\">Non déclenché (travail rendu ou verrouillé avant)<\/span>'}<\/div>${fl.items.map((it, ii) => itemHtml(it, ii, p.answers[it.id], st, p)).join(\"\")}`).join(\"\")}<\/section>`;\n\n  document.querySelectorAll(\"[data-go]\").forEach(b => b.onclick = () => document.getElementById(\"m_\" + b.dataset.go).scrollIntoView({ behavior: \"smooth\" }));\n  document.querySelectorAll(\"[data-rb]\").forEach(c => c.onchange = () => { const [id, k] = c.dataset.rb.split(\"|\"); const s2 = store.get(f.key); s2.rb = s2.rb || {}; s2.rb[id] = s2.rb[id] || []; s2.rb[id][+k] = c.checked; store.set(f.key, s2); refresh(); });\n  document.querySelectorAll(\"[data-ov]\").forEach(i => i.onchange = () => { const s2 = store.get(f.key); s2.ov = s2.ov || {}; s2.ov[i.dataset.ov] = i.value; store.set(f.key, s2); refresh(); });\n}\nfunction refresh() { const y = window.scrollY; renderList(); renderGroup(); window.scrollTo(0, y); }\nfunction itemHtml(it, ii, a, st, p) {\n  const hb = p && p.hints && p.hints[it.id];\n  const au = auto(it, a), isOpen = it.type === \"text\" || it.type === \"multitext\";\n  const score = itemScore(it, a, st, p), ov = st.ov?.[it.id] ?? \"\", cert = p?.certitude?.[it.id];\n  const cls = score >= it.pts - 1e-9 ? \"ok\" : score > 0 ? \"mid\" : \"ko\";\n  return `<div class=\"item\"><div class=\"ih\"><span class=\"k\">Épreuve ${ii + 1} · ${KIND[it.type]} · ${fr(it.pts)} pt${hb ? ` · <span class=\"flag\">indice acheté (−${fr(HINTS[it.id] ?? 0)})<\/span>` : \"\"}${cert ? ` · certitude : <b>${{ s: \"sûr\", h: \"hésitant\", d: \"devine\" }[cert]}<\/b>` : \"\"}<\/span>\n    <span class=\"pts\"><span class=\"tag ${cls} auto\">${fr(score)} / ${fr(it.pts)}<\/span><label class=\"noprint\">Note manuelle <input type=\"number\" step=\"0.05\" min=\"0\" max=\"${it.pts}\" data-ov=\"${it.id}\" value=\"${esc(ov)}\" placeholder=\"auto\"><\/label><\/span><\/div>\n    <p class=\"q\">${esc(it.q)}<\/p>\n    <div class=\"cols\"><div class=\"box\"><h5>Réponse du groupe<\/h5>${showAnswer(it, a)}<\/div><div class=\"box\"><h5>Attendu<\/h5>${showExpected(it)}<\/div><\/div>\n    ${isOpen ? `<div class=\"grid\"><b>Grille de correction<\/b> <small>(chaque critère vaut ${fr(it.pts / it.rubric.length)} pt)<\/small>${it.rubric.map((r, k) => `<label><input type=\"checkbox\" data-rb=\"${it.id}|${k}\" ${st.rb?.[it.id]?.[k] ? \"checked\" : \"\"}> ${esc(r)}<\/label>`).join(\"\")}<\/div>` : \"\"}\n    <div class=\"cor\"><b>Corrigé : <\/b>${esc(it.cor)}<\/div><\/div>`;\n}\n\nfunction calibHtml(g, p) {\n  if (!p.certitude) return \"\";\n  const L = { s: { n: 0, ok: 0 }, h: { n: 0, ok: 0 }, d: { n: 0, ok: 0 } };\n  g.missions.forEach(m => m.items.forEach(it => { const c = p.certitude[it.id]; if (!c || !L[c]) return; const r = auto(it, p.answers[it.id]).s; if (r == null) return; L[c].n++; if (r >= it.pts - 1e-9) L[c].ok++; }));\n  const pc = x => x.n ? Math.round(x.ok / x.n * 100) + \" %\" : \"—\";\n  return `<div><b>Calibration de la certitude<\/b> <small style=\"color:var(--muted)\">(part d'épreuves entièrement justes selon le niveau déclaré ; un groupe bien calibré a « sûr » proche de 100 %)<\/small><div class=\"calib\"><div>Sûr<b>${pc(L.s)}<\/b>${L.s.n} épreuves<\/div><div>Hésitant<b>${pc(L.h)}<\/b>${L.h.n} épreuves<\/div><div>Je devine<b>${pc(L.d)}<\/b>${L.d.n} épreuves<\/div><\/div><\/div>`;\n}\nfunction itemLabel(g, id) {\n  for (const m of [...g.missions, ...g.flashes]) { const i = m.items.findIndex(x => x.id === id); if (i >= 0) return `${m.title} · épreuve ${i + 1}`; }\n  return id;\n}\n/* ---------- Exports ---------- */\n$(\"#print\").onclick = () => { if (!cur) return alertBox(\"Sélectionnez d'abord un groupe.\"); document.body.classList.remove(\"bilan\"); window.print(); };\n$(\"#bilan\").onclick = () => { if (!cur) return alertBox(\"Sélectionnez d'abord un groupe.\"); document.body.classList.add(\"bilan\"); window.print(); setTimeout(() => document.body.classList.remove(\"bilan\"), 500); };\n\n/* ---------- Vue d'ensemble ---------- */\n$(\"#overview\").onclick = () => {\n  if (!files.length) return alertBox(\"Chargez d'abord des fichiers.\");\n  cur = null; renderList();\n  const LINES = [\"Économie 6.1-6.2\", \"Atelier A1-A3\", \"MSGN ch. 1-3\", \"Économie 6.3-6.4\", \"MSGN ch. 4-5\", \"Réflexion\"];\n  const col = r => `hsl(${Math.round(r * 120)} 60% ${document.documentElement.matches(\":root\") && matchMedia(\"(prefers-color-scheme: dark)\").matches ? 30 : 82}%)`;\n  const rows = files.map(f => { const sc = scoreFile(f); return { f, sc, cells: sc.per.map(x => x.s / x.m.pts), flash: sc.fl.reduce((t, x) => t + x.s, 0) / 1.5 }; });\n  const avg = k => rows.reduce((t, r) => t + r.cells[k], 0) / rows.length;\n  $(\"#main\").innerHTML = `<div class=\"panel\"><h2 style=\"font:800 24px var(--f-d);margin:0 0 6px\">Carte des erreurs<\/h2><p style=\"color:var(--muted);margin:0 0 12px\">Taux de réussite par ligne du tirage. Les colonnes les plus rouges indiquent les notions à reprendre en remédiation.<\/p>\n  <div style=\"overflow-x:auto\"><table class=\"heat\"><tr><th>Groupe<\/th>${LINES.map(l => `<th>${l}<\/th>`).join(\"\")}<th>Flashs<\/th><th>Note<\/th><\/tr>\n  ${rows.map(r => `<tr><td style=\"text-align:left\"><b>${r.f.p.group}<\/b><br><small>${esc(r.f.p.members)}<\/small><\/td>${r.cells.map(c => `<td style=\"background:${col(c)}\">${Math.round(c * 100)} %<\/td>`).join(\"\")}<td style=\"background:${col(r.flash)}\">${Math.round(r.flash * 100)} %<\/td><td>${fr(r.sc.final)}<\/td><\/tr>`).join(\"\")}\n  <tr><td style=\"text-align:left\"><b>Moyenne<\/b><\/td>${LINES.map((l, k) => `<td style=\"background:${col(avg(k))}\">${Math.round(avg(k) * 100)} %<\/td>`).join(\"\")}<td><\/td><td>${fr(rows.reduce((t, r) => t + r.sc.final, 0) / rows.length)}<\/td><\/tr><\/table><\/div>\n  <h3 style=\"font:800 18px var(--f-d);margin:18px 0 6px\">Les dix épreuves les moins réussies<\/h3><ol>${rows.flatMap(r => r.sc.g.missions.flatMap(m => m.items.map(it => ({ g: r.f.p.group, m, it, s: itemScore(it, r.f.p.answers[it.id], store.get(r.f.key), r.f.p) / it.pts })))).filter(x => x.s != null && !isNaN(x.s)).sort((a, b) => a.s - b.s).slice(0, 10).map(x => `<li><b>${x.g}<\/b> · ${esc(x.m.title)} · ${KIND[x.it.type]} : ${Math.round(Math.max(0, x.s) * 100)} %<\/li>`).join(\"\")}<\/ol><\/div>`;\n};\n\n/* ---------- En ligne ---------- */\nconst SBU = \"https://ugrzvirjnsvtlgdmfjhg.supabase.co\", SBK = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVncnp2aXJqbnN2dGxnZG1mamhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDQ2NTAsImV4cCI6MjEwMDkyMDY1MH0.   if (!active() || Date.now() < suppressUntil || S.awayAt) return;
  S.awayAt = Date.now(); save();
  showAway();
}
function cameBack() {
  if (!S.awayAt) return;
  const dur = Date.now() - S.awayAt;
  S.awayAt = null;
  S.exits.push({ at: new Date(Date.now() - dur).toISOString(), dur: Math.round(dur / 100) / 10 });
  clearInterval(awayTimer); $("#veil").innerHTML = "";
  if (dur <= GRACE && runningFlash()) openFlash();
  if (dur > GRACE) lock("Vous avez quitté la mission pendant " + fr(Math.round(dur / 1000)) + " secondes.");
  else { save(); toast(`Sortie n° ${S.exits.length} enregistrée. Elle vous coûtera des points.`); updateBar(); }
}
function showAway() {
  const t0 = S.awayAt;
  $("#veil").innerHTML = `<div class="veil"><div class="box"><div class="eyebrow">Sortie détectée</div><div class="big" id="cd">10</div><p>Revenez sur la mission immédiatement. Au-delà de 10 secondes, la session sera verrouillée.</p></div></div>`;
  clearInterval(awayTimer);
  awayTimer = setInterval(() => {
    const left = Math.max(0, Math.ceil((GRACE - (Date.now() - t0)) / 1000));
    const el = $("#cd"); if (el) el.textContent = left;
    if (left <= 0 && document.visibilityState === "visible" && !document.hasFocus()) { /* reste affiché ; verrouillage au retour */ }
  }, 200);
}
document.addEventListener("visibilitychange", () => document.visibilityState === "hidden" ? goneAway() : (document.hasFocus() ? cameBack() : null));
window.addEventListener("blur", goneAway);
window.addEventListener("focus", cameBack);
window.addEventListener("pagehide", () => { if (active() && !S.awayAt) { S.awayAt = Date.now(); save(); } });
document.addEventListener("fullscreenchange", () => { $("#fsb").hidden = !!document.fullscreenElement || !active(); });
$("#fsbtn").onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});

function lock(reason) {
  S.locked = true; S.lockedAt = new Date().toISOString(); S.lockReason = reason; save();
  if (S.session) rpc("mp_submit", { p_code: S.session, p_grp: S.group, p_status: "verrouillé", p_payload: payload("verrouillé") }).catch(() => {});
  render();
}

/* ---------- Export JSON ---------- */
function payload(status) {
  const g = G();
  const p = { app: "melting-pot-4h", version: 1, group: S.group, members: S.members, startedAt: S.started ? new Date(S.started).toISOString() : null,
    submittedAt: S.submitted ? new Date(S.submitted).toISOString() : null, status, lockedAt: S.lockedAt, exits: S.exits, unlocks: S.unlocks,
    answers: S.answers, redacteurs: S.redac, verifications: S.verif, hints: S.hints, pastes: S.pastes, flashes: S.flash, certitude: S.cert, vault: S.vault, audit: S.audit, messages: S.msgs, session: S.session, missionMinutes: Object.fromEntries(Object.entries(S.mtime).map(([k, v]) => [k, Math.round(v / 600) / 100])), exportedAt: new Date().toISOString() };
  p.sig = fnv(JSON.stringify(p) + SALT);
  return p;
}
function download(status) {
  const p = payload(status);
  const name = `MeltingPot_${S.group}_${(G()?.members || "").replace(/[^A-Za-zÀ-ÿ]+/g, "-").replace(/^-|-$/g, "")}${status === "rendu" ? "" : "_" + status}.json`;
  if (S.session) rpc("mp_submit", { p_code: S.session, p_grp: S.group, p_status: status, p_payload: p }).then(() => toast("Travail aussi transmis en ligne au professeur.")).catch(() => {});
  suppressUntil = Date.now() + 8000;
  const url = URL.createObjectURL(new Blob([JSON.stringify(p, null, 1)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  return name;
}

/* ---------- Progression ---------- */
function answered(it) {
  if (CLOSED.includes(it.type) && !/^G\d+f\d/.test(it.id) && !S.cert[it.id]) return false;
  return answeredRaw(it);
}
function answeredRaw(it) {
  const a = S.answers[it.id];
  if (a == null) return false;
  switch (it.type) {
    case "qcm": return !!a;
    case "multi": return a.length > 0;
    case "classify": return it.items.every(x => a[x.id] != null);
    case "match": return it.left.every(x => a[x.id]);
    case "order": return !!S.orderTouched[it.id];
    case "num": return it.fields.every(f => String(a[f.id] ?? "").trim() !== "");
    case "fill": return it.blanks.every(b => a[b.id]);
    case "tf": return it.stmts.every(s => a[s.id] && a[s.id].v != null && String(a[s.id].j || "").trim().length > 5);
    case "text": return String(a).trim().length > 40;
    case "multitext": return it.fields.every(f => String(a[f.id] || "").trim().length > 15);
  }
}
const mstat = m => { const d = m.items.filter(answered).length; return { d, n: m.items.length }; };
function progress() { const g = G(); let d = 0, n = 0; g.missions.forEach(m => { const s = mstat(m); d += s.d; n += s.n; }); return n ? Math.round(d / n * 100) : 0; }

/* ---------- Barre ---------- */
function updateBar() {
  const on = !!S.started && !!S.group;
  $("#bar").hidden = !on;
  if (!on) return;
  $("#bGroup").textContent = `${S.group} · ${G().members}`;
  const left = Math.max(0, DURATION - (Date.now() - S.started));
  const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), s = Math.floor(left % 60000 / 1000);
  $("#sTime").firstChild.textContent = left > 0 ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : "Terminé";
  $("#sTime").classList.toggle("alert", left < 15 * 60000);
  $("#sProg").firstChild.textContent = progress() + " %";
  $("#sExit").firstChild.textContent = S.exits.length;
  $("#sExit").classList.toggle("alert", S.exits.length > 0);
  $("#sHint").firstChild.textContent = hintCost() ? "−" + fr(hintCost()) : "0";
  $("#sFlash").firstChild.textContent = Object.keys(S.flash).length + "/3";
}
function flashTick() {
  if (!active() || S.awayAt) return;
  const g = G(), now = Date.now();
  const running = g.flashes.find(f => S.flash[f.id] && !S.flash[f.id].done);
  if (running) {
    const f = S.flash[running.id];
    if (now >= f.start + FLASH_LEN) { f.done = true; f.closedAt = new Date(now).toISOString(); S.flashMin = false; save(); closeFlash(); toast(`Flash « ${running.title} » clos. Réponses enregistrées.`); if (view.name === "board") render(); }
    else updateFlashClock(running, f.start + FLASH_LEN - now);
    return;
  }
  const grace = 0;
  const due = g.flashes.find(f => !S.flash[f.id] && (S.flashDue[f.id] || (now - S.started) >= f.at * 60000 + grace));
  if (due) startFlash(due);
}
function startFlash(f) { S.flash[f.id] = { start: Date.now(), startedAt: new Date().toISOString() }; S.flashMin = false; save(); beep("flash"); openFlash(); updateBar(); }
function runningFlash() { const g = G(); return g && g.flashes.find(f => S.flash[f.id] && !S.flash[f.id].done); }
function openFlash() {
  const f = runningFlash(); if (!f) return;
  if (S.flashMin) { $("#veil").innerHTML = `<button class="pill" id="fpill">⚡ Flash · <span id="fclock">10:00</span> · rouvrir</button>`; $("#fpill").onclick = () => { S.flashMin = false; save(); openFlash(); }; updateFlashClock(f, S.flash[f.id].start + FLASH_LEN - Date.now()); return; }
  $("#veil").innerHTML = `<div class="veil flash"><div class="box" role="dialog" aria-label="Flash"><div class="ticker"><span>⚡ DERNIÈRE MINUTE</span><b id="fclock">10:00</b></div><div class="fbody">
    <div class="eyebrow">Flash ${G().flashes.indexOf(f) + 1} sur 3 · ${fr(f.pts)} pt · 10 minutes pour répondre</div><h2>${esc(f.title)}</h2><p class="news">${esc(f.news)}</p>
    ${f.items.map((it, i) => `<section class="item" id="w_${it.id}"><div class="ih"><span class="kind">Question ${i + 1} · ${KIND[it.type]}</span><span class="pts">${fr(it.pts)} pt</span></div><p class="q">${esc(it.q)}</p><div class="body"></div></section>`).join("")}
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="lead" style="font-size:14px">Vos réponses sont enregistrées en continu et figées à la fin du compte à rebours.</span><button class="btn" id="fmin">Réduire pour consulter les missions</button></div></div></div></div>`;
  f.items.forEach(it => { renderItem(it); mark(it); });
  $("#fmin").onclick = () => { S.flashMin = true; save(); openFlash(); };
  updateFlashClock(f, S.flash[f.id].start + FLASH_LEN - Date.now());
}
function closeFlash() { $("#veil").innerHTML = ""; }
function updateFlashClock(f, left) { const el = $("#fclock"); if (el) { const s = Math.max(0, Math.ceil(left / 1000)); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; } }

setInterval(() => {
  updateBar();
  flashTick();
  tickScenario();
  if (view.name === "mission" && active() && document.visibilityState === "visible") {

}, 1000);
$("#bBoard").onclick = () => go("board");

function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 3500); }
function go(name, mission) { view = { name, mission: mission ?? null }; render(); window.scrollTo(0, 0); if (runningFlash()) openFlash(); }

/* ---------- Rendu des écrans ---------- */
function render() {
  updateBar();
  const app = $("#app");
  if (S.locked) return renderLock();
  if (S.submitted) return renderDone();
  if (!S.group) return renderHome(app);
  if (!S.started) return S.ready ? renderWait(app) : renderRules(app);

}

  };

  $("#veil").innerHTML = `<div class="veil lock"><div class="box"><h2>Session verrouillée</h2>
  <p>${esc(S.lockReason || "Vous avez quitté la mission plus de 10 secondes.")}</p>
  <p><b>Sorties enregistrées :</b> ${S.exits.length} · <b>Progression :</b> ${S.group ? progress() : 0} %</p>
  <p>Téléchargez votre travail en l'état et remettez le fichier au professeur. Il contient votre travail et le relevé des sorties.</p>
  <button class="btn primary" id="lDl">Télécharger le fichier JSON</button>
  <details class="prof"><summary>Déverrouillage par le professeur</summary><div style="display:flex;gap:8px;margin-top:8px"><input type="text" id="lCode" autocomplete="off" aria-label="Code professeur"><button class="btn" id="lUn">Déverrouiller</button></div></details></div></div>`;

/* ---------- Mission ---------- */
function renderMission(app) {
  const g = G(), idx = g.missions.findIndex(m => m.id === view.mission), m = g.missions[idx];
  if (m.line === 6 && !reflOpen()) { toast("La réflexion se déverrouille quand les cinq premières missions sont complètes."); view = { name: "board" }; return renderBoard(app); }
  app.style.setProperty("--c", `var(${COLORS[m.line]})`);
  app.innerHTML = `<button class="back" id="bk">← Tableau des missions</button>
  <div class="mhead"><div class="src">Mission ${idx + 1} · ${esc(m.src)}</div><h1>${esc(m.title)}</h1>
  <div class="meta"><span>${fr(m.pts)} points</span><span>${m.items.length} épreuves</span><span>${m.time} min conseillées</span></div></div>
  <div class="brief"><div class="who">Votre rôle : ${esc(m.role)}</div>${esc(m.brief)}</div>
  ${redacHtml(m)}
  ${m.doc ? `<div class="doc">${m.doc}</div>` : ""}
  <div id="items">${m.items.map((it, i) => `<section class="item" id="w_${it.id}"><div class="ih"><span class="kind">Épreuve ${i + 1} · ${KIND[it.type]}</span><span class="pts">${fr(it.pts)} pt${it.pts > 1 ? "s" : ""}</span></div><p class="q">${esc(it.q)}</p><div class="body"></div></section>`).join("")}</div>
  ${verifyHtml(m)}
  <div class="mnav">${idx > 0 ? `<button class="btn" id="prev">← Mission ${idx}</button>` : "<span></span>"}${idx < 5 ? `<button class="btn primary" id="next">Mission ${idx + 2} →</button>` : `<button class="btn primary" id="toBoard">Retour au tableau</button>`}</div>`;
  $("#bk").onclick = () => go("board");
  if ($("#prev")) $("#prev").onclick = () => go("mission", g.missions[idx - 1].id);
  if ($("#next")) $("#next").onclick = () => go("mission", g.missions[idx + 1].id);
  if ($("#toBoard")) $("#toBoard").onclick = () => go("board");
  m.items.forEach(it => { renderItem(it); renderCert(it); mark(it); renderHint(it); });
  bindRedac(m); bindVerify(m);
}
function renderCert(it) {
  if (!CLOSED.includes(it.type)) return;
  const w = document.getElementById("w_" + it.id); if (!w) return;
  const d = document.createElement("div"); d.className = "cert";
  d.innerHTML = `<span>Votre certitude :</span>${CERT.map(([k, l]) => `<button type="button" data-c="${k}" class="${S.cert[it.id] === k ? "on" : ""}">${l}</button>`).join("")}`;
  d.querySelectorAll("button").forEach(b => b.onclick = () => { S.cert[it.id] = b.dataset.c; save(); d.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); mark(it); updateBar(); refreshVerify(); });
  w.querySelector(".body").after(d);
}
function redacHtml(m) {
  const r = S.redac[m.id] || "";
  return `<div class="roles ok"><label for="redac">Qui rédige cette mission ?</label><select id="redac" style="max-width:320px"><option value="">— choisir —</option>${members().map(n => `<option ${r === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select><p class="lead" style="font-size:13px;margin:6px 0 0">Changez de rédacteur d'une mission à l'autre : tout le groupe doit savoir écrire sur chaque notion.</p></div>`;
}
function bindRedac(m) { const s = $("#redac"); if (s) s.onchange = () => { S.redac[m.id] = s.value; save(); }; }
function renderHint(it) {
  if (it.h == null) return;
  const w = document.getElementById("w_" + it.id); if (!w) return;
  let bar = w.querySelector(".hintbar"); if (!bar) { bar = document.createElement("div"); bar.className = "hintbar"; w.appendChild(bar); }
  const bought = S.hints[it.id];
  if (bought) { bar.innerHTML = `<div class="hint"><b>Indice (−${fr(bought.cost)} pt) :</b> ${esc(dec(it.h, it.id + "h"))}</div>`; return; }
  bar.innerHTML = `<button class="hbtn" type="button">Acheter un indice · −${fr(it.hc)} pt</button>`;
  const b = bar.querySelector("button");
  b.onclick = () => {
    if (!b.classList.contains("confirm")) { b.classList.add("confirm"); b.textContent = `Confirmer : −${fr(it.hc)} pt sur la note`; setTimeout(() => { if (b.isConnected && !S.hints[it.id]) { b.classList.remove("confirm"); b.textContent = `Acheter un indice · −${fr(it.hc)} pt`; } }, 4000); return; }
    S.hints[it.id] = { cost: it.hc, at: new Date().toISOString() }; save(); renderHint(it); updateBar();
  };
}
function countErrors(it) {
  const k = dec(it.k, it.id), a = S.answers[it.id] || {};
  switch (it.type) {
    case "qcm": return [a === k ? 0 : 1, 1];
    case "multi": { const C = new Set(k), A = new Set(Array.isArray(a) ? a : []); let e = 0; it.opts.forEach(o => { if (C.has(o.id) !== A.has(o.id)) e++; }); return [e, it.opts.length]; }
    case "classify": return [it.items.filter(x => a[x.id] !== k[x.id]).length, it.items.length];
    case "match": return [it.left.filter(l => a[l.id] !== k[l.id]).length, it.left.length];
    case "order": return [k.filter((id, i) => (Array.isArray(a) ? a[i] : null) !== id).length, k.length];
    case "num": return [it.fields.filter(f => { const v = parseNum(a[f.id]); return isNaN(v) || Math.abs(v - k[f.id].v) > k[f.id].tol + 1e-9; }).length, it.fields.length];
    case "fill": return [it.blanks.filter(b => a[b.id] !== k[b.id]).length, it.blanks.length];
    case "tf": return [it.stmts.filter(s => !a[s.id] || a[s.id].v !== k[s.id]).length, it.stmts.length];
  }
}
function verifyHtml(m) {
  const closed = m.items.filter(i => CLOSED.includes(i.type)); if (!closed.length) return "";
  const v = S.verif[m.id], ready = closed.every(answered);
  return `<div class="verify"><b>Vérification de la mission</b> <span class="lead" style="font-size:14px">(une seule fois, épreuves fermées uniquement, rédactions non vérifiées)</span>
  ${v ? `<div class="res ${v.errors ? "bad" : "good"}">${v.errors ? `${v.errors} erreur${v.errors > 1 ? "s" : ""} sur ${v.total} éléments vérifiés. À vous de les trouver.` : "Aucune erreur dans les épreuves fermées."}</div>`
      : `<div style="margin-top:10px"><button class="btn" id="vbtn" ${ready ? "" : "disabled"}>Vérifier mes épreuves fermées</button> ${ready ? "" : '<span class="lead" style="font-size:13px">Remplissez d\'abord toutes les épreuves fermées.</span>'}</div>`}</div>`;
}
function bindVerify(m) {
  const b = $("#vbtn"); if (!b) return;
  b.onclick = () => {
    if (!b.classList.contains("primary")) { b.classList.add("primary"); b.textContent = "Confirmer : vous n'aurez qu'un seul essai"; return; }
    let e = 0, n = 0; m.items.filter(i => CLOSED.includes(i.type)).forEach(it => { const [x, y] = countErrors(it); e += x; n += y; });
    S.verif[m.id] = { at: new Date().toISOString(), errors: e, total: n }; save();
    const y = window.scrollY; renderMission($("#app")); window.scrollTo(0, y);
  };
}
const flashOf = id => G().flashes.find(f => id.startsWith(f.id));
const setA = (it, v) => { const f = flashOf(it.id); if (f && (!S.flash[f.id] || S.flash[f.id].done)) return toast("Ce flash est clos."); S.answers[it.id] = v; save(); mark(it); updateBar(); refreshVerify(); };
function refreshVerify() {
  if (view.name !== "mission") return;
  const m = G().missions.find(x => x.id === view.mission), el = document.querySelector("#app .verify");
  if (!m || !el || S.verif[m.id]) return;
  const t = document.createElement("div"); t.innerHTML = verifyHtml(m); el.replaceWith(t.firstElementChild); bindVerify(m);
}
const mark = it => { const w = document.getElementById("w_" + it.id); if (w) w.classList.toggle("answered", !!answered(it)); };

function renderItem(it) {
  const box = document.querySelector(`#w_${it.id} .body`), a = S.answers[it.id];
  const name = "n_" + it.id;
  switch (it.type) {
    case "qcm":
      box.innerHTML = `<div class="opts">${it.opts.map(o => `<label class="opt ${a === o.id ? "on" : ""}"><input type="radio" name="${name}" value="${o.id}" ${a === o.id ? "checked" : ""}><span>${esc(o.t)}</span></label>`).join("")}</div>`;
      box.querySelectorAll("input").forEach(i => i.onchange = () => { setA(it, i.value); box.querySelectorAll(".opt").forEach(l => l.classList.toggle("on", l.contains(i))); });
      break;
    case "multi": {
      const cur = new Set(a || []);
      box.innerHTML = `<div class="opts">${it.opts.map(o => `<label class="opt ${cur.has(o.id) ? "on" : ""}"><input type="checkbox" value="${o.id}" ${cur.has(o.id) ? "checked" : ""}><span>${esc(o.t)}</span></label>`).join("")}</div>`;
      box.querySelectorAll("input").forEach(i => i.onchange = () => { i.checked ? cur.add(i.value) : cur.delete(i.value); i.closest(".opt").classList.toggle("on", i.checked); setA(it, [...cur]); });
      break; }
    case "classify": {
      const cur = Object.assign({}, a || {});
      const useSelect = it.cats.length > 4 || it.cats.some(c => c.length > 34);
      box.innerHTML = `<div class="rows">${it.items.map(x => `<div class="row"><span>${esc(x.t)}</span>${useSelect
        ? `<select data-x="${x.id}" aria-label="Catégorie"><option value="">— choisir —</option>${it.cats.map((c, ci) => `<option value="${ci}" ${cur[x.id] === ci ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`
        : `<div class="seg">${it.cats.map((c, ci) => `<button type="button" data-x="${x.id}" data-c="${ci}" class="${cur[x.id] === ci ? "on" : ""}">${esc(c)}</button>`).join("")}</div>`}</div>`).join("")}</div>`;
      box.querySelectorAll("select").forEach(s => s.onchange = () => { if (s.value === "") delete cur[s.dataset.x]; else cur[s.dataset.x] = +s.value; setA(it, { ...cur }); });
      box.querySelectorAll(".seg button").forEach(b => b.onclick = () => { cur[b.dataset.x] = +b.dataset.c; b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); setA(it, { ...cur }); });
      break; }
    case "match": {
      const cur = Object.assign({}, a || {});
      box.innerHTML = `<div class="rows">${it.left.map(l => `<div class="row"><b style="font-weight:600">${esc(l.t)}</b><select data-l="${l.id}" aria-label="Association"><option value="">— choisir —</option>${it.right.map(r => `<option value="${r.id}" ${cur[l.id] === r.id ? "selected" : ""}>${esc(r.t)}</option>`).join("")}</select></div>`).join("")}</div>`;
      box.querySelectorAll("select").forEach(s => s.onchange = () => { if (s.value) cur[s.dataset.l] = s.value; else delete cur[s.dataset.l]; setA(it, { ...cur }); });
      break; }
    case "order": {
      let cur = (a && a.length === it.items.length) ? a.slice() : it.items.map(x => x.id);
      const txt = Object.fromEntries(it.items.map(x => [x.id, x.t]));
      const draw = () => {
        box.innerHTML = `<div class="rows">${cur.map((id, k) => `<div class="ord"><b>${k + 1}</b><span>${esc(txt[id])}</span><button type="button" data-k="${k}" data-d="-1" aria-label="Monter" ${k === 0 ? "disabled" : ""}>↑</button><button type="button" data-k="${k}" data-d="1" aria-label="Descendre" ${k === cur.length - 1 ? "disabled" : ""}>↓</button></div>`).join("")}</div><p class="count">Utilisez les flèches pour remettre les étapes dans l'ordre.</p>`;
        box.querySelectorAll("button").forEach(b => b.onclick = () => { const k = +b.dataset.k, j = k + +b.dataset.d; [cur[k], cur[j]] = [cur[j], cur[k]]; S.orderTouched[it.id] = true; setA(it, cur.slice()); draw(); });
      };
      draw(); break; }
    case "num": {
      const cur = Object.assign({}, a || {});
      box.innerHTML = it.fields.map(f => `<div class="numf"><label for="${it.id}_${f.id}">${esc(f.label)}</label><input type="text" inputmode="decimal" id="${it.id}_${f.id}" data-f="${f.id}" value="${esc(cur[f.id] ?? "")}" autocomplete="off"><span class="u">${esc(f.unit)}</span></div>`).join("") + `<p class="count">Arrondissez au dixième si besoin. Une valeur négative s'écrit avec le signe −.</p>`;
      box.querySelectorAll("input").forEach(i => i.oninput = () => { cur[i.dataset.f] = i.value; setA(it, { ...cur }); });
      break; }
    case "fill": {
      const cur = Object.assign({}, a || {});
      let html = esc(it.text);
      it.blanks.forEach((b, k) => { html = html.replace(`[[${k}]]`, `<select data-b="${b.id}" aria-label="Choix ${k + 1}"><option value="">……</option>${b.opts.map(o => `<option ${cur[b.id] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`); });
      box.innerHTML = `<p class="fill">${html}</p>`;
      box.querySelectorAll("select").forEach(s => s.onchange = () => { if (s.value) cur[s.dataset.b] = s.value; else delete cur[s.dataset.b]; setA(it, { ...cur }); });
      break; }
    case "tf": {
      const cur = JSON.parse(JSON.stringify(a || {}));
      box.innerHTML = it.stmts.map(s => `<div class="tfrow"><b style="font-weight:600">${esc(s.t)}</b><div class="seg"><button type="button" data-s="${s.id}" data-v="1" class="${cur[s.id]?.v === true ? "on" : ""}">Vrai</button><button type="button" data-s="${s.id}" data-v="0" class="${cur[s.id]?.v === false ? "on" : ""}">Faux</button></div><input type="text" data-j="${s.id}" placeholder="Justification" value="${esc(cur[s.id]?.j || "")}" aria-label="Justification"></div>`).join("");
      box.querySelectorAll(".seg button").forEach(b => b.onclick = () => { cur[b.dataset.s] = { ...(cur[b.dataset.s] || {}), v: b.dataset.v === "1" }; b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); setA(it, JSON.parse(JSON.stringify(cur))); });
      box.querySelectorAll("input").forEach(i => i.oninput = () => { cur[i.dataset.j] = { ...(cur[i.dataset.j] || {}), j: i.value }; setA(it, JSON.parse(JSON.stringify(cur))); });
      break; }
    case "text":
      box.innerHTML = `<textarea rows="${Math.max(6, Math.min(it.lines + 2, 24))}" aria-label="Votre réponse">${esc(a || "")}</textarea><div class="count"></div>`;
      { const ta = box.querySelector("textarea"), c = box.querySelector(".count"); const cnt = () => c.textContent = `${ta.value.trim().split(/\s+/).filter(Boolean).length} mots · environ ${it.lines} lignes attendues`; cnt(); ta.oninput = () => { setA(it, ta.value); cnt(); }; }
      break;
    case "multitext": {
      const cur = Object.assign({}, a || {});
      box.innerHTML = `<div class="mt">${it.fields.map(f => `<label for="${it.id}_${f.id}">${esc(f.label)}</label><textarea rows="3" id="${it.id}_${f.id}" data-f="${f.id}">${esc(cur[f.id] || "")}</textarea>`).join("")}</div>`;
      box.querySelectorAll("textarea").forEach(t => t.oninput = () => { cur[t.dataset.f] = t.value; setA(it, { ...cur }); });
      break; }
  }
}

  async function refreshInfo() {

        <div class="groups">${DATA.map(g => `<div class="gbtn" style="${fresh.has(g.id) ? "border-color:var(--ok)" : "opacity:.55"}"><b>${g.id.replace("G", "Groupe ")} ${fresh.has(g.id) ? "· prêt ✓" : "· en attente"}</b>${esc(g.members)}</div>`).join("")}</div>
        <div style="margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="plaunch" style="font-size:18px;padding:14px 26px">Lancer la mission pour tous</button><span class="lead" id="pls">${online ? `${fresh.size} groupe(s) prêt(s) sur ${DATA.length}.` : "Pas de connexion : démarrez chaque poste avec votre mot de passe depuis son écran d'attente."}</span></div>`;
        const b = $("#plaunch");
        b.onclick = async () => {
          if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = "Confirmer le lancement"; return; }
          try { await rpc("mp_push_event", { p_code: SESSION, p_secret: secret, p_kind: "start", p_target: "", p_payload: {} }); show(); }
          catch (e) { $("#pls").textContent = "Lancement impossible : vérifiez la connexion."; }
        };
      };
      draw();
      timers.push(setInterval(async () => { await refreshInfo(); if (startedAt) show(); else draw(); }, 5000));
      return;
    }
    // Tableau projeté
    $("#pbody").innerHTML = `<div class="proj"><div class="pl"><div class="eyebrow">Temps restant</div><div class="pclock" id="pclock">4:00:00</div><div class="eyebrow">Supports autorisés</div><div class="ppal" id="ppal"></div><button class="btn" id="pfs" style="margin-top:14px">Plein écran</button></div><ul class="pfeed" id="pfeed"></ul></div>`;
    $("#pfs").onclick = () => document.documentElement.requestFullscreen?.().catch(() => {});
    TL.forEach(x => { if (Date.now() - startedAt >= x.at * 60000) seen.add(x.id); });
    const tick = () => {
      const el = Date.now() - startedAt, left = Math.max(0, DURATION - el);
      const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), s2 = Math.floor(left % 60000 / 1000);
      const c = $("#pclock"); if (!c) return;
      c.textContent = `${h}:${String(m).padStart(2, "0")}:${String(s2).padStart(2, "0")}`; c.classList.toggle("low", left < 15 * 60000);
      $("#ppal").textContent = PALIERS[el < 60 * 60000 ? 0 : el < 180 * 60000 ? 1 : 2];
      let fresh = false;
      TL.forEach(x => { if (!seen.has(x.id) && el >= x.at * 60000) { seen.add(x.id); fresh = true; } });
      if (fresh) beep("flash");
      $("#pfeed").innerHTML = TL.filter(x => seen.has(x.id)).reverse().map(x => `<li style="--c:${x.c}"><time>${new Date(startedAt + x.at * 60000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</time><b>${x.t}</b><p>${x.d}</p></li>`).join("");
    };
    tick(); timers.push(setInterval(tick, 1000));
  }
  async function showSuivi() {
    shell(`<p class="lead">Chargement…</p>`);
    const draw = async () => {
      await refreshInfo();
      const rows = statusRows;
      $("#pbody").innerHTML = `<div class="eyebrow">Séance ${SESSION} · ${startedAt ? "lancée à " + new Date(startedAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "non lancée"} · ${online ? "en ligne" : "hors ligne"}</div><h1>Suivi</h1>
      <p class="lead" style="font-size:14px">À ne pas projeter. Actualisation toutes les 15 secondes. Pour débloquer un poste verrouillé, tapez votre mot de passe sur son écran.</p>
      <div class="doc"><table><thead><tr><th>Groupe</th><th>Dernier signal</th><th>Avancement</th><th>Sorties</th><th>Indices</th><th>Flashs</th><th>Coffre</th><th>État</th></tr></thead><tbody>
      ${rows.map(r => { const x = r.payload, age = Math.round((Date.now() - Date.parse(r.updated_at)) / 1000); return `<tr><td><b>${r.grp}</b><br><small>${esc(x.members)}</small></td><td style="${age > 90 ? "color:var(--warn)" : ""}">il y a ${age} s</td><td>${x.prog} %</td><td style="${x.exits ? "color:var(--warn);font-weight:700" : ""}">${x.exits}</td><td>${x.hints ? "−" + fr(x.hints) : "0"}</td><td>${x.flashes}/3</td><td>${x.vault ? "ouvert" : "fermé"}</td><td>${x.submitted ? "rendu" : x.locked ? "<b style='color:var(--warn)'>verrouillé</b>" : x.ready ? "prêt" : "en cours"}</td></tr>`; }).join("") || `<tr><td colspan="8">Aucun groupe connecté.</td></tr>`}</tbody></table></div>
      <div class="rules"><h3>Écrire aux groupes</h3><label class="eyebrow" for="pmto">Destinataire</label><select id="pmto"><option value="">Tous les groupes</option>${DATA.map(g => `<option value="${g.id}">${g.id} · ${esc(g.members)}</option>`).join("")}</select>
        <label class="eyebrow" for="pmtx" style="display:block;margin-top:8px">Message</label><textarea id="pmtx" rows="2"></textarea><div style="margin-top:8px"><button class="btn primary" id="psend">Envoyer</button> <span id="pms" class="lead" style="font-size:14px"></span></div></div>
      <details class="prof"><summary>Réinitialiser la séance (après un essai)</summary><p>Efface le lancement, les messages, le suivi et les travaux reçus en ligne. Sur chaque poste d'essai, utilisez aussi « Réinitialiser cet ordinateur » avec votre mot de passe.</p><button class="btn danger" id="preset">Réinitialiser la séance</button></details>`;
      $("#psend").onclick = async () => {
        const t = $("#pmtx").value.trim(); if (!t) return;
        try { await rpc("mp_push_event", { p_code: SESSION, p_secret: secret, p_kind: "message", p_target: $("#pmto").value, p_payload: { text: t, from: "Direction" } }); $("#pms").textContent = "Message envoyé."; $("#pmtx").value = ""; }
        catch (e) { $("#pms").textContent = "Envoi impossible : pas de connexion."; }
      };
      const r = $("#preset");
      r.onclick = async () => {
        if (!r.dataset.arm) { r.dataset.arm = 1; r.textContent = "Confirmer : tout effacer"; return; }
        try { await rpc("mp_reset", { p_code: SESSION, p_secret: secret }); seen.clear(); r.textContent = "Séance réinitialisée"; } catch (e) { r.textContent = "Échec : pas de connexion"; }
      };
    };
    await draw();
    timers.push(setInterval(() => { if (!document.activeElement || !/TEXTAREA|SELECT/.test(document.activeElement.tagName)) draw(); }, 15000));
  }
  function showCorr() {
    shell(`<p class="lead" style="font-size:14px">Les travaux rendus en ligne se chargent automatiquement. Les copies de secours (fichiers JSON) peuvent être glissées dans la colonne de gauche.</p><iframe id="pcons" title="Correction" style="width:100%;height:calc(100vh - 150px);border:1px solid var(--line);border-radius:12px;background:var(--panel)"></iframe>`);
    $("#pcons").srcdoc = CONSOLE_TPL.replace("/*__DATA__*/null", () => consoleData);
  }
  return { open };
})();

boot();
</script>
</body>
</html>
