<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melting-pot STMG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Parcours en 7 étapes : frise à gauche, atelier de l'étape à droite ; escape game plein écran ; espace professeur en onglets */
:root{
  --bg:#eceff5; --panel:#fff; --ink:#131c33; --muted:#5b6782; --line:#d4dae6; --soft:#f5f7fb;
  --navy:#1b2f5e; --eco:#0f6e6a; --atelier:#b06a10; --refl:#7a3a73; --accent:#2c4fb8; --ok:#1d7a46; --warn:#b3261e; --gold:#b8860b;
  --f-d:"Bricolage Grotesque","DejaVu Sans",system-ui,sans-serif; --f-b:"Archivo","DejaVu Sans",system-ui,sans-serif; --f-m:"JetBrains Mono","DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1322;--panel:#151d31;--ink:#e5eaf4;--muted:#9ba7c1;--line:#2a3550;--soft:#1b2540;--navy:#93abea;--eco:#4fc2bb;--atelier:#e4a24a;--refl:#d18ccb;--accent:#8aa4ff;--ok:#5fcf8c;--warn:#ff8a80;--gold:#e8c25a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1322;--panel:#151d31;--ink:#e5eaf4;--muted:#9ba7c1;--line:#2a3550;--soft:#1b2540;--navy:#93abea;--eco:#4fc2bb;--atelier:#e4a24a;--refl:#d18ccb;--accent:#8aa4ff;--ok:#5fcf8c;--warn:#ff8a80;--gold:#e8c25a;color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-b);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--panel);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar .brand{font:800 20px/1 var(--f-d)} .bar .brand small{display:block;font:500 11px var(--f-m);letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:3px}
.bar .st{font:700 14px var(--f-m)}
main{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 80px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 18px;min-height:44px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--navy);color:var(--panel);border-color:var(--navy)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:var(--f-d);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.5vw,44px);line-height:1.05;font-weight:800} h2{font-size:24px;font-weight:800} h3{font-size:18px;font-weight:800}
.lead{color:var(--muted);max-width:68ch}
.eyebrow{font:600 12px var(--f-m);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
input[type=text],input[type=number],input[type=url],input[type=password],textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical;line-height:1.5}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.hint{font-size:13.5px;color:var(--muted)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.gbtn{text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:72px}
.gbtn:hover{border-color:var(--navy)}
.gbtn b{display:block;font:700 13px var(--f-m);color:var(--muted)}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;min-height:44px}
/* Parcours */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.tl{display:flex;flex-direction:column;gap:8px;position:sticky;top:76px}
@media (max-width:860px){.tl{position:static;flex-direction:row;overflow-x:auto}}
.st-btn{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:200px}
.st-btn .num{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font:700 14px var(--f-m);background:var(--soft);flex:none}
.st-btn small{display:block;color:var(--muted);font-size:12.5px}
.st-btn.cur{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--navy)}
.st-btn.valide .num{background:var(--ok);color:#fff}
.st-btn.depose .num{background:var(--accent);color:#fff}
.st-btn.reprendre .num{background:var(--atelier);color:#fff}
.st-btn.lock{opacity:.5}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font:600 12px var(--f-m);border:1px solid currentColor}
.c-ok{color:var(--ok)} .c-wait{color:var(--accent)} .c-redo{color:var(--atelier)} .c-lock{color:var(--muted)}
.shead{border-left:6px solid var(--navy);padding:2px 0 2px 16px;margin-bottom:16px}
.shead .src{font:700 12px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.box{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
.box ul{margin:6px 0;padding-left:20px} .box li{margin:4px 0}
.alert{border-radius:12px;padding:12px 16px;margin:12px 0;font-weight:600}
.alert.wait{background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--accent)}
.alert.redo{background:color-mix(in srgb,var(--atelier) 14%,var(--panel));color:var(--atelier)}
.alert.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));color:var(--ok)}
.files{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.files li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.links{display:flex;flex-direction:column;gap:6px}
.links .row{display:flex;gap:6px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.q p{font-weight:600;margin:0 0 8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;margin-top:6px;background:var(--panel)}
.opt input{width:20px;height:20px;margin-top:2px;flex:none}
.opt.on{border-color:var(--navy);background:color-mix(in srgb,var(--navy) 8%,var(--panel))}
.opt.none{border-style:dashed;color:var(--muted)}
/* Écrit (épreuves) */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px 14px;margin-bottom:18px;overflow-x:auto}
.doc h4{font:700 15px var(--f-d);margin:14px 0 8px}
.doc table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--soft)} .doc .src{font-size:12.5px;color:var(--muted)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;--c:var(--navy)}
.item .ih{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font:700 12px var(--f-m);color:var(--muted);text-transform:uppercase}
.item .q2{font-weight:600;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;min-height:40px;font-size:14px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:var(--panel)}
.ord{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.ord b{font:700 14px var(--f-m);width:24px} .ord span{flex:1}
.ord button{border:1px solid var(--line);background:var(--soft);border-radius:8px;width:40px;height:40px}
.numf{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.numf input{text-align:right;font-family:var(--f-m)} .numf .u{font:500 13px var(--f-m);color:var(--muted);min-width:60px}
@media (max-width:640px){.numf{grid-template-columns:1fr 1fr}.numf label{grid-column:1/-1}}
.fill{line-height:2.4} .fill select{width:auto;display:inline-block;min-height:38px;padding:4px 8px}
.tfrow{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.count{font:500 12px var(--f-m);color:var(--muted);text-align:right;margin-top:4px}
.mt label{display:block;font-weight:600;margin:10px 0 6px}
/* Escape */
.esc{background:#0b1020;color:#eef2fb;border-radius:18px;padding:22px;--line:#2a3552;--panel:#141c33;--soft:#1b2540;--ink:#eef2fb;--muted:#9aa6c0}
.esc .lead,.esc .hint{color:#9aa6c0}
.esc .eyebrow{color:#e8c25a}
.esc input[type=text],.esc select,.esc textarea{background:#141c33;color:#eef2fb;border-color:#2a3552}
.esc .btn{background:#141c33;color:#eef2fb;border-color:#2a3552}
.esc .btn.primary{background:#e8c25a;color:#0b1020;border-color:#e8c25a}
.stages{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.stages span{font:700 12px var(--f-m);padding:6px 10px;border-radius:99px;border:1px solid #2a3552;color:#9aa6c0}
.stages span.on{border-color:#e8c25a;color:#e8c25a} .stages span.done{background:#1d7a46;border-color:#1d7a46;color:#fff}
.etime{font:800 34px var(--f-m);color:#e8c25a}
.cwrap{overflow-x:auto;padding-bottom:6px}
.cw{display:grid;gap:2px;width:max-content}
.cell{width:34px;height:34px;position:relative}
.cell.on{background:#f4f1e6;border-radius:3px}
.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:700 18px var(--f-m);text-transform:uppercase;color:#111;padding:0;min-height:0;border-radius:3px}
.cell input:focus{background:#ffe9a8;outline:none}
.cell b{position:absolute;top:1px;left:2px;font:700 9px var(--f-m);color:#555;pointer-events:none}
.clues{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:14px;font-size:14.5px}
@media (max-width:760px){.clues{grid-template-columns:minmax(0,1fr)}}
.clues ol{margin:6px 0;padding-left:0;list-style:none} .clues li{margin:4px 0}
.cipher{font:700 17px/1.7 var(--f-m);letter-spacing:.12em;word-break:break-word;background:#141c33;border:1px solid #2a3552;border-radius:10px;padding:10px 14px;margin:8px 0}
.wheel{overflow-x:auto} .wheel table{border-collapse:collapse;font:700 14px var(--f-m)} .wheel td{border:1px solid #2a3552;padding:4px 6px;text-align:center;min-width:26px}
.enig{border:1px solid #2a3552;border-radius:12px;padding:14px;margin-bottom:12px}
.enig.done{border-color:#1d7a46}
.qtimer{height:8px;background:#2a3552;border-radius:99px;overflow:hidden;margin:10px 0} .qtimer i{display:block;height:100%;background:#e8c25a}
.fin .row{border-color:#2a3552}
/* Prof */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.ptabs button{border:0;background:none;padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;min-height:44px}
.ptabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.ptabs .badge{background:var(--warn);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.t td.n{font:700 14px var(--f-m)}
.twrap{overflow-x:auto}
.grow{cursor:pointer} .grow:hover td{background:var(--soft)}
.dots{display:flex;gap:4px} .dots i{width:14px;height:14px;border-radius:99px;background:var(--line);display:block}
.dots i.valide{background:var(--ok)} .dots i.depose{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)} .dots i.reprendre{background:var(--atelier)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:900px){.cmp{grid-template-columns:minmax(0,1fr)}}
.cmp>div{background:var(--soft);border-radius:9px;padding:10px 12px;font-size:14px;overflow-x:auto}
.cmp h5{margin:0 0 6px;font:700 11px var(--f-m);text-transform:uppercase;color:var(--muted)}
.good{color:var(--ok);font-weight:700} .bad{color:var(--warn);font-weight:700}
.ans{white-space:pre-wrap}
.cor{margin-top:8px;border-left:4px solid var(--accent);padding:6px 12px;font-size:14px;background:var(--soft);border-radius:0 8px 8px 0}
.rub label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:14px;cursor:pointer} .rub input{width:18px;height:18px;margin-top:2px}
.decide{position:sticky;bottom:0;background:var(--panel);border:2px solid var(--navy);border-radius:14px;padding:14px 16px;margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:end;z-index:5}
.decide label{font:600 12px var(--f-m);text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.media img,.media video{max-width:100%;border-radius:8px;margin-top:6px;max-height:420px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:10px;font-weight:600;max-width:90vw}
.veil{position:fixed;inset:0;z-index:50;background:rgba(10,14,28,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.veil .vb{background:var(--panel);color:var(--ink);border-radius:16px;max-width:560px;width:100%;padding:26px}
.lb li{font:700 18px var(--f-d);margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar" id="bar" hidden><div class="brand">Melting-pot<small id="bGroup"></small></div><div class="st" id="bInfo"></div></header>
<main id="app"></main>
<div id="veil"></div>
<div id="toast" class="toast" hidden></div>
<script>
const PUB = [{"id":"G01","members":"Cesar, Nikita, Clement","steps":{"1":{"title":"Le poids des dépenses publiques","src":"Éco · Ch. 1 · 6.1","qs":[{"id":"q1","q":"Les prélèvements obligatoires regroupent :","opts":["les cotisations sociales et les amendes","les impôts et les cotisations sociales","les impôts, les cotisations et les emprunts","les impôts versés à l'État central et aux régions"]},{"id":"q2","q":"Des dépenses publiques supérieures aux recettes publiques sur une année entraînent :","opts":["une baisse mécanique de la dette","un excédent du budget de l'État","une hausse des impôts l'année suivante","un déficit public pour l'année"]},{"id":"q3","q":"Le comportement de passager clandestin consiste à :","opts":["voyager dans les transports en commun à prix réduit","épuiser une ressource avant les autres usagers","profiter d'un bien sans le financer","utiliser un bien privé sans le payer au vendeur"]},{"id":"q4","q":"Le coût d'opportunité d'une dépense publique correspond :","opts":["à ce à quoi on renonce en n'affectant pas cet argent ailleurs","au salaire des fonctionnaires qui gèrent le projet","au prix d'achat initial du bien financé","au montant des intérêts payés chaque année sur la dette contractée pour la financer"]},{"id":"q5","q":"Un « effet boule de neige » de la dette apparaît surtout quand :","opts":["l'inflation est supérieure à 2 %","le taux d'intérêt dépasse le taux de croissance","la croissance dépasse le taux d'intérêt","l'État dégage un excédent primaire"]},{"id":"q6","q":"Une externalité négative est :","opts":["une perte subie par l'entreprise sur ses ventes","un défaut de qualité sur le produit vendu","une taxe payée par le producteur à l'État","un coût imposé à un tiers sans compensation monétaire"]},{"id":"q7","q":"Une nationalisation désigne :","opts":["l'implantation d'une entreprise étrangère sur le territoire","la vente d'une entreprise publique à des investisseurs privés","le transfert d'une entreprise privée vers la propriété publique","la création d'une filiale dans un autre pays"]},{"id":"q8","q":"Une privatisation procure à l'État :","opts":["une recette ponctuelle, mais la perte des dividendes futurs","un contrôle renforcé sur l'entreprise","une recette annuelle qui se renouvelle d'elle-même chaque année ensuite","une baisse rapide du chômage"]},{"id":"q9","q":"Dans la conception de l'État gendarme, l'État :","opts":["prend en charge l'ensemble des risques sociaux auxquels sont exposés les ménages","se limite à garantir la sécurité et le respect des contrats","fixe les prix des biens de première nécessité","organise la production des principales entreprises"]},{"id":"q10","q":"Le principe pollueur-payeur consiste à :","opts":["interdire la production polluante sur le territoire","indemniser le pollueur pour les pertes de production liées aux normes","faire payer la dépollution par les riverains","faire supporter au pollueur le coût de ses dommages"]},{"id":"q11","q":"Sur le marché décrit, l'information est détenue par :","opts":["le vendeur, qui connaît l'état réel du véhicule","l'État, qui immatricule les véhicules","l'acheteur, qui compare les annonces en ligne","l'assureur, qui couvre le véhicule"]},{"id":"q12","q":"En présence d'une externalité négative, le marché seul conduit à :","opts":["un prix trop élevé pour le consommateur","une production trop faible du bien","une production trop importante du bien","une disparition rapide du producteur"]},{"id":"q13","q":"Si l'acheteur ne propose qu'un prix moyen, les propriétaires de bonnes voitures :","opts":["se retirent du marché","achètent les mauvaises voitures","baissent leur prix de vente","obtiennent une prime de l'État"]},{"id":"q14","q":"Une économie mixte est une économie où :","opts":["deux monnaies circulent en même temps","les entreprises fixent les impôts","l'État est l'unique producteur","le marché et l'intervention publique coexistent"]},{"id":"q15","q":"La « tragédie des biens communs » désigne :","opts":["la disparition des services publics faute d'impôts","la surexploitation d'une ressource rivale en accès libre","la hausse des prix des biens de première nécessité","le refus des entreprises de produire des biens privés"]},{"id":"q16","q":"Une cotisation sociale se distingue d'un impôt car elle :","opts":["finance exclusivement les collectivités locales","est versée de manière volontaire","ouvre des droits à des prestations en contrepartie","est prélevée sur les entreprises, pas sur les salariés"]},{"id":"q17","q":"Le solde public primaire correspond au solde public :","opts":["corrigé de l'inflation de l'année","hors charge d'intérêts de la dette","des collectivités locales et des hôpitaux","hors dépenses de protection sociale"]},{"id":"q18","q":"Le libéralisme économique recommande que l'État :","opts":["organise lui-même la production et fixe les quantités dans les secteurs clés","fixe les prix des biens essentiels","prenne en charge l'essentiel de la protection sociale","limite son rôle aux fonctions régaliennes et au cadre du marché"]},{"id":"q19","q":"L'État reste souvent actionnaire dans l'énergie ou la défense pour :","opts":["garantir la souveraineté du pays dans des secteurs stratégiques","éviter de payer les salaires de ces entreprises","limiter la concurrence sur ces marchés","maximiser le dividende qu'il perçoit chaque année de ces entreprises"]},{"id":"q20","q":"La Sécurité sociale créée en 1945 est financée principalement par :","opts":["des dons volontaires des entreprises","la vente d'entreprises publiques","des cotisations sociales","des emprunts émis sur les marchés"]}]},"2":{"title":"Veille et données massives","src":"MSGN · Ch. 1","role":"Cellule de veille d'Altitude Sport","brief":"Altitude Sport, enseigne nationale d'articles de sport (fictive), se demande s'il faut ouvrir un rayon padel dans ses 80 magasins. Votre cellule doit organiser la veille et dire comment exploiter les données dont dispose l'enseigne : 1,2 million de cartes de fidélité, un site marc const unlocked = n => !!GS.started_at && (n === 1 || stOf(n - 1).status === "valide" || (n === 7 && GS.escape_open));
const currentStep = () => { for (let n = 1; n <= 7; n++) if (unlocked(n) && stOf(n).status !== "valide") return n; return 7; };
const draft = n => (S.drafts[n] = S.drafts[n] || {});

async function refresh() {
  if (!S.group) return;
  try { const r = await rpc("mp_group_state", { p_code: SESSION, p_grp: S.group }); const sg = x => JSON.stringify(x.steps) + x.started_at + x.escape_open + x.files.length; const before = sg(GS); GS = r || GS; online = true; if (before !== sg(GS)) onChange(); }
  catch (e) { online = false; }
  bar();
}
let lastSig = null;
function onChange() {
  const sig = GS.steps.map(s => s.step + s.status).join();
  if (lastSig !== null && sig !== lastSig && view.step && stOf(view.step).status === "valide") view.step = currentStep();
  if (lastSig !== null && sig !== lastSig) { beep(); const v = GS.steps.filter(s => s.status === "valide").length; toast(v ? `Mise à jour du professeur : ${v} étape(s) validée(s).` : "Mise à jour du professeur."); }
  lastSig = sig;
  if (!S.esc || !S.esc.start || S.esc.done) render();
}
setInterval(refresh, 6000);
function bar() {
  const on = !!S.group && location.hash !== "#prof";
  $("#bar").hidden = !on; if (!on) return;
  $("#bGroup").textContent = `${G().id.replace("G", "Groupe ")} · ${G().members}`;
  const v = GS.steps.filter(s => s.status === "valide").length;
  $("#bInfo").textContent = `${S.role === "pc" ? "PC du groupe" : "Tablette"} · ${online ? "● en ligne" : "○ hors ligne"} · ${v}/7 étapes validées`;
}

/* ---------- Rendu élève ---------- */
function render() {
  if (location.hash === "#prof") return Prof.open();
  bar();
  const app = $("#app");
  if (!S.group) return home(app);
  if (!S.role) return roleChoice(app);
  if (!GS.started_at) return waiting(app);
  if (view.step == null || !unlocked(view.step)) view.step = currentStep();
  parcours(app);
}
function home(app) {
  app.innerHTML = `<div class="eyebrow">Terminale STMG · Économie & Management</div><h1>Melting-pot : le parcours</h1>
  <p class="lead">Six défis, un par notion tirée au sort, puis un escape game final. Chaque étape se débloque quand le professeur a validé la précédente. Choisissez votre groupe. Une tablette peut aussi ouvrir cette page pour déposer des fichiers (photos, vidéos) dans l'étape en cours.</p>
  <p><button class="back" id="toProf">Espace professeur →</button></p>
  <div class="groups">${PUB.map(g => `<button class="gbtn" data-g="${g.id}"><b>${g.id.replace("G", "Groupe ")}</b>${esc(g.members)}</button>`).join("")}</div>`;
  app.querySelectorAll(".gbtn").forEach(b => b.onclick = () => { S.group = b.dataset.g; save(); refresh().then(render); });
  $("#toProf").onclick = () => { location.hash = "prof"; };
}
function roleChoice(app) {
  app.innerHTML = `<button class="back" id="chg">← Changer de groupe</button><div class="eyebrow">${G().id.replace("G", "Groupe ")} · ${esc(G().members)}</div><h1>Quel est cet appareil ?</h1>
  <div class="groups" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
   <button class="gbtn" id="rpc"><b>PC DU GROUPE</b>Un seul par groupe. Il passe les épreuves 1, 2 et l'escape game, rédige et dépose.</button>
   <button class="gbtn" id="rtab"><b>TABLETTE OU APPAREIL D'APPOINT</b>Recherches, création, photos et vidéos. Dépôt de fichiers pour les étapes 3 à 6 uniquement.</button></div>
  <p class="hint" id="rmsg"></p>`;
  $("#chg").onclick = () => { S.group = null; save(); render(); };
  $("#rtab").onclick = () => { S.role = "tab"; save(); render(); };
  $("#rpc").onclick = async () => {
    try { const r = await rpc("mp_claim", { p_code: SESSION, p_grp: S.group, p_device: S.device }); if (r === "ok") { S.role = "pc"; save(); render(); } else $("#rmsg").textContent = "Un autre PC est déjà enregistré pour ce groupe. Utilisez ce PC-là, ou demandez au professeur de le libérer. Vous pouvez aussi utiliser cet appareil comme tablette."; }
    catch (e) { $("#rmsg").textContent = "Pas de connexion : impossible d'enregistrer ce PC pour l'instant."; }
  };
}
function waiting(app) {
  app.innerHTML = `<button class="back" id="chg">← Changer de groupe</button><div class="eyebrow">${G().id.replace("G", "Groupe ")} · ${esc(G().members)}</div><h1>Le parcours va commencer</h1>
  <div class="panel" style="margin-top:16px"><h3>Comment ça marche</h3><ol>
   <li>Six étapes, chacune sur une de vos notions et sous une forme différente : QCM à barème négatif, épreuve écrite du bac, support original, jeu de révision, vidéo, préparation de Grand oral.</li>
   <li>Vous déposez chaque travail ici. Le professeur le vérifie : il valide (étape suivante débloquée) ou vous demande de reprendre.</li>
   <li>Le PC du groupe sert à rédiger et à déposer. Les tablettes servent à chercher, créer, filmer et déposer des fichiers pour les étapes 3 à 6.</li>
   <li><b>Épreuves 1, 2 et escape game : uniquement sur le PC du groupe, sans recherche.</b> Tablettes, téléphones et cours rangés. Les sorties de page sont détectées et signalées au professeur.</li>
   <li>Pour finir : l'escape game. Quitter la page pendant l'escape game coûte une minute de pénalité.</li></ol>
   <p class="hint" id="wst">${online ? "Connecté. En attente du lancement par le professeur." : "Connexion en cours…"}</p></div>`;
  $("#chg").onclick = () => { S.group = null; S.role = null; save(); render(); };
}
function parcours(app) {
  const g = G(), n = view.step, info = STEPS[n - 1];
  app.innerHTML = `<div class="layout"><nav class="tl" aria-label="Étapes">${STEPS.map(s => {
      const st = stOf(s.n).status, u = unlocked(s.n);
      const lab = st ? STATUS[st][0] : u ? "En cours" : "Verrouillée";
      return `<button class="st-btn ${st || ""} ${s.n === n ? "cur" : ""} ${u ? "" : "lock"}" data-s="${s.n}" ${u ? "" : "disabled"}><span class="num">${st === "valide" ? "✓" : u ? s.n : "🔒"}</span><span><b>${s.label}</b><small>${lab} · ${s.time} min</small></span></button>`; }).join("")}</nav>
    <section id="ws" style="min-width:0"></section></div>`;
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { view.step = +b.dataset.s; if (S.role === "pc" && LOCKED.includes(view.step)) document.documentElement.requestFullscreen?.().catch(() => {}); render(); window.scrollTo(0, 0); });
  const ws = $("#ws"), st = stOf(n);
  const data = n < 7 ? g.steps[n] : null;
  ws.innerHTML = `<div class="shead"><div class="src">Étape ${n} · ${info.label}${data && data.src ? " · " + esc(data.src) : ""}</div><h1>${esc(n === 7 ? "Escape game final" : n === 6 ? data.title : data.title)}</h1></div>
   ${st.status === "valide" ? `<div class="alert ok">Étape validée par le professeur.${st.comment ? " Commentaire : " + esc(st.comment) : ""}</div>` : ""}
   ${st.status === "depose" ? `<div class="alert wait">Travail déposé, en attente de validation. Vous pouvez encore le modifier et le déposer à nouveau.</div>` : ""}
   ${st.status === "reprendre" ? `<div class="alert redo">À reprendre. ${st.comment ? "Commentaire du professeur : " + esc(st.comment) : ""}</div>` : ""}
   <div id="body"></div>`;
  const ro = st.status === "valide";
  if (LOCKED.includes(n) && S.role !== "pc") { $("#body").innerHTML = `<div class="alert redo">Cette épreuve se passe uniquement sur le PC du groupe, sans recherche ni support. Rejoignez votre PC.</div><p class="lead">Sur cet appareil, vous pouvez préparer les étapes 3 à 6 et y déposer des fichiers.</p>`; return; }
  if (LOCKED.includes(n) && !ro && st.status !== "depose") $("#body").insertAdjacentHTML("beforebegin", `<div class="alert redo">Épreuve sans recherche : tablettes, téléphones et cours rangés. Quitter cette page est détecté et signalé au professeur${n === 7 ? " (+60 secondes)" : " (−0,25 point par sortie)"}.${S.exits[n] ? ` Sorties enregistrées : ${S.exits[n].length}.` : ""}</div>`);
  ({ qcm: wQcm, ecrit: wEcrit, support: wCreate, jeu: wCreate, video: wCreate, go: wGo, escape: wEscape })[info.kind]($("#body"), n, ro);
}

/* ---------- Dépôt ---------- */
async function deposit(n, payload) {
  try { const r = await rpc("mp_step_save", { p_code: SESSION, p_grp: S.group, p_step: n, p_payload: payload }); if (r !== "ok") throw new Error(r); toast("Travail déposé. Le professeur va le vérifier."); beep(); await refresh(); render(); }
  catch (e) { toast("Dépôt impossible : " + ({ verrouille: "étape verrouillée", deja_valide: "étape déjà validée", non_lance: "parcours non lancé" }[e.message] || "vérifiez la connexion") + "."); }
}
function depositBar(n, ro, check, build) {
  if (ro) return "";
  return `<div class="panel" style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="dep">Déposer ce travail</button><span class="hint" id="depmsg">Le professeur sera prévenu immédiatement.</span></div>`;
}
function bindDeposit(n, check, build) {
  const b = $("#dep"); if (!b) return;
  b.onclick = () => { const err = check(); if (err) { $("#depmsg").textContent = err; $("#depmsg").style.color = "var(--warn)"; return; } b.disabled = true; deposit(n, build()).finally(() => { b.disabled = false; }); };
}

/* ---------- Étape 1 : QCM à barème négatif ---------- */
function wQcm(el, n, ro) {
  const d = G().steps[1], a = draft(1).answers = draft(1).answers || {};
  el.innerHTML = `<p class="lead">« ${esc(d.title)} » et ses notions connexes. Vingt questions, une seule bonne réponse à chaque fois.</p>
  <div class="box"><b>Barème négatif.</b> Bonne réponse : +1. Mauvaise réponse : −0,5. Sans réponse : 0. Ne cochez que si vous êtes raisonnablement sûrs.</div>
  ${d.qs.map((q, i) => `<div class="q"><p>${i + 1}. ${esc(q.q)}</p>${q.opts.map((o, k) => `<label class="opt ${a[q.id] === k ? "on" : ""}"><input type="radio" name="${q.id}" value="${k}" ${a[q.id] === k ? "checked" : ""} ${ro ? "disabled" : ""}><span>${esc(o)}</span></label>`).join("")}
   <label class="opt none ${a[q.id] == null ? "on" : ""}"><input type="radio" name="${q.id}" value="" ${a[q.id] == null ? "checked" : ""} ${ro ? "disabled" : ""}><span>Je ne réponds pas (0 point)</span></label></div>`).join("")}
  ${depositBar(n, ro)}<p class="hint" id="qn"></p>`;
  const cnt = () => { const k = Object.values(a).filter(v => v != null).length; $("#qn").textContent = `${k} réponse(s) donnée(s), ${20 - k} sans réponse.`; };
  el.querySelectorAll("input[type=radio]").forEach(i => i.onchange = () => { a[i.name] = i.value === "" ? null : +i.value; save(); i.closest(".q").querySelectorAll(".opt").forEach(l => l.classList.toggle("on", l.contains(i))); cnt(); });
  cnt();
  bindDeposit(n, () => Object.values(a).filter(v => v != null).length ? "" : "Répondez au moins à une question.", () => ({ answers: a, exits: S.exits[1] || [] }));
}

/* ---------- Étape 2 : écrit du bac ---------- */
function setA(it, v) { S.answers[it.id] = v; save(); }
function renderItem(it) {
  const box = document.querySelector(`#w_${it.id} .body`), a = S.answers[it.id];
  const name = "n_" + it.id;
  switch (it.type) {
    case "qcm":
      box.innerHTML = `<div class="opts">${it.opts.map(o => `<label class="opt ${a === o.id ? "on" : ""}"><input type="radio" name="${name}" value="${o.id}" ${a === o.id ? "checked" : ""}><span>${esc(o.t)}</span></label>`).join("")}</div>`;
      box.querySelectorAll("input").forEach(i => i.onchange = () => { setA(it, i.value); box.querySelectorAll(".opt").forEach(l => l.classList.toggle("on", l.contains(i))); });
      break;
    case "multi": {
      const cur = new Set(a || []);
      box.innerHTML = `<div class="opts">${it.opts.map(o => `<label class="opt ${cur.has(o.id) ? "on" : ""}"><input type="checkbox" value="${o.id}" ${cur.has(o.id) ? "checked" : ""}><span>${esc(o.t)}</span></label>`).join("")}</div>`;
      box.querySelectorAll("input").forEach(i => i.onchange = () => { i.checked ? cur.add(i.value) : cur.delete(i.value); i.closest(".opt").classList.toggle("on", i.checked); setA(it, [...cur]); });
      break; }
    case "classify": {
      const cur = Object.assign({}, a || {});
      const useSelect = it.cats.length > 4 || it.cats.some(c => c.length > 34);
      box.innerHTML = `<div class="rows">${it.items.map(x => `<div class="row"><span>${esc(x.t)}</span>${useSelect
        ? `<select data-x="${x.id}" aria-label="Catégorie"><option value="">— choisir —</option>${it.cats.map((c, ci) => `<option value="${ci}" ${cur[x.id] === ci ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`
        : `<div class="seg">${it.cats.map((c, ci) => `<button type="button" data-x="${x.id}" data-c="${ci}" class="${cur[x.id] === ci ? "on" : ""}">${esc(c)}</button>`).join("")}</div>`}</div>`).join("")}</div>`;
      box.querySelectorAll("select").forEach(s => s.onchange = () => { if (s.value === "") delete cur[s.dataset.x]; else cur[s.dataset.x] = +s.value; setA(it, { ...cur }); });
      box.querySelectorAll(".seg button").forEach(b => b.onclick = () => { cur[b.dataset.x] = +b.dataset.c; b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); setA(it, { ...cur }); });
      break; }
    case "match": {
      const cur = Object.assign({}, a || {});
      box.innerHTML = `<div class="rows">${it.left.map(l => `<div class="row"><b style="font-weight:600">${esc(l.t)}</b><select data-l="${l.id}" aria-label="Association"><option value="">— choisir —</option>${it.right.map(r => `<option value="${r.id}" ${cur[l.id] === r.id ? "selected" : ""}>${esc(r.t)}</option>`).join("")}</select></div>`).join("")}</div>`;
      box.querySelectorAll("select").forEach(s => s.onchange = () => { if (s.value) cur[s.dataset.l] = s.value; else delete cur[s.dataset.l]; setA(it, { ...cur }); });
      break; }
    case "order": {
      let cur = (a && a.length === it.items.length) ? a.slice() : it.items.map(x => x.id);
      const txt = Object.fromEntries(it.items.map(x => [x.id, x.t]));
      const draw = () => {
        box.innerHTML = `<div class="rows">${cur.map((id, k) => `<div class="ord"><b>${k + 1}</b><span>${esc(txt[id])}</span><button type="button" data-k="${k}" data-d="-1" aria-label="Monter" ${k === 0 ? "disabled" : ""}>↑</button><button type="button" data-k="${k}" data-d="1" aria-label="Descendre" ${k === cur.length - 1 ? "disabled" : ""}>↓</button></div>`).join("")}</div><p class="count">Utilisez les flèches pour remettre les étapes dans l'ordre.</p>`;
        box.querySelectorAll("button").forEach(b => b.onclick = () => { const k = +b.dataset.k, j = k + +b.dataset.d; [cur[k], cur[j]] = [cur[j], cur[k]]; S.orderTouched[it.id] = true; setA(it, cur.slice()); draw(); });
      };
      draw(); break; }
    case "num": {
      const cur = Object.assign({}, a || {});
      box.innerHTML = it.fields.map(f => `<div class="numf"><label for="${it.id}_${f.id}">${esc(f.label)}</label><input type="text" inputmode="decimal" id="${it.id}_${f.id}" data-f="${f.id}" value="${esc(cur[f.id] ?? "")}" autocomplete="off"><span class="u">${esc(f.unit)}</span></div>`).join("") + `<p class="count">Arrondissez au dixième si besoin. Une valeur négative s'écrit avec le signe −.</p>`;
      box.querySelectorAll("input").forEach(i => i.oninput = () => { cur[i.dataset.f] = i.value; setA(it, { ...cur }); });
      break; }
    case "fill": {
      const cur = Object.assign({}, a || {});
      let html = esc(it.text);
      it.blanks.forEach((b, k) => { html = html.replace(`[[${k}]]`, `<select data-b="${b.id}" aria-label="Choix ${k + 1}"><option value="">……</option>${b.opts.map(o => `<option ${cur[b.id] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`); });
      box.innerHTML = `<p class="fill">${html}</p>`;
      box.querySelectorAll("select").forEach(s => s.onchange = () => { if (s.value) cur[s.dataset.b] = s.value; else delete cur[s.dataset.b]; setA(it, { ...cur }); });
      break; }
    case "tf": {
      const cur = JSON.parse(JSON.stringify(a || {}));
      box.innerHTML = it.stmts.map(s => `<div class="tfrow"><b style="font-weight:600">${esc(s.t)}</b><div class="seg"><button type="button" data-s="${s.id}" data-v="1" class="${cur[s.id]?.v === true ? "on" : ""}">Vrai</button><button type="button" data-s="${s.id}" data-v="0" class="${cur[s.id]?.v === false ? "on" : ""}">Faux</button></div><input type="text" data-j="${s.id}" placeholder="Justification" value="${esc(cur[s.id]?.j || "")}" aria-label="Justification"></div>`).join("");
      box.querySelectorAll(".seg button").forEach(b => b.onclick = () => { cur[b.dataset.s] = { ...(cur[b.dataset.s] || {}), v: b.dataset.v === "1" }; b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); setA(it, JSON.parse(JSON.stringify(cur))); });
      box.querySelectorAll("input").forEach(i => i.oninput = () => { cur[i.dataset.j] = { ...(cur[i.dataset.j] || {}), j: i.value }; setA(it, JSON.parse(JSON.stringify(cur))); });
      break; }
    case "text":
      box.innerHTML = `<textarea rows="${Math.max(6, Math.min(it.lines + 2, 24))}" aria-label="Votre réponse">${esc(a || "")}</textarea><div class="count"></div>`;
      { const ta = box.querySelector("textarea"), c = box.querySelector(".count"); const cnt = () => c.textContent = `${ta.value.trim().split(/\s+/).filter(Boolean).length} mots · environ ${it.lines} lignes attendues`; cnt(); ta.oninput = () => { setA(it, ta.value); cnt(); }; }
      break;
    case "multitext": {
      const cur = Object.assign({}, a || {});
      box.innerHTML = `<div class="mt">${it.fields.map(f => `<label for="${it.id}_${f.id}">${esc(f.label)}</label><textarea rows="3" id="${it.id}_${f.id}" data-f="${f.id}">${esc(cur[f.id] || "")}</textarea>`).join("")}</div>`;
      box.querySelectorAll("textarea").forEach(t => t.oninput = () => { cur[t.dataset.f] = t.value; setA(it, { ...cur }); });
      break; }
  }
}
function wEcrit(el, n, ro) {
  const d = G().steps[2];
  el.innerHTML = `<div class="box"><b>Conditions de l'épreuve écrite.</b> Travaillez comme le jour du bac : lisez le dossier, répondez à chaque question, rédigez des phrases complètes et argumentées. Cette étape se fait sur le PC du groupe : les réponses sont enregistrées sur cet appareil jusqu'au dépôt.</div>
  <div class="box" style="border-style:solid"><div class="eyebrow">Mise en situation · ${esc(d.role)}</div>${esc(d.brief)}</div>
  ${d.doc ? `<div class="doc">${d.doc}</div>` : ""}
  ${d.items.map((it, i) => `<section class="item" id="w_${it.id}"><div class="ih"><span>Question ${i + 1} · ${KIND[it.type]}</span><span>${fr(it.pts)} pt</span></div><p class="q2">${esc(it.q)}</p><div class="body"></div></section>`).join("")}
  ${depositBar(n, ro)}`;
  d.items.forEach(it => renderItem(it));
  if (ro) el.querySelectorAll("input,select,textarea,.seg button,.ord button").forEach(x => x.disabled = true);
  bindDeposit(n, () => d.items.filter(it => S.answers[it.id] == null).length > 2 ? "Plusieurs questions sont sans réponse." : "", () => ({ answers: Object.fromEntries(d.items.map(it => [it.id, S.answers[it.id] ?? null])), orderTouched: S.orderTouched, exits: S.exits[2] || [] }));
}

function filesBlock(n, ro) {
  const fs = GS.files.filter(f => f.step === n);
  const links = draft(n).links = draft(n).links || [""];

function auto(it, a) {
  if (a == null) return { s: 0, detail: null };
  switch (it.type) {
    case "qcm": return { s: a === it.ans ? it.pts : 0 };
    case "multi": { const C = new Set(it.ans), hits = a.filter(x => C.has(x)).length, wrong = a.length - hits; return { s: Math.max(0, (hits - wrong) / C.size) * it.pts }; }
    case "classify": { const n = it.items.length, ok = it.items.filter(x => a[x.id] === it.ans[x.id]).length; return { s: ok / n * it.pts, ok, n }; }
    case "match": { const n = it.left.length, ok = it.left.filter(l => a[l.id] === it.ans[l.id]).length; return { s: ok / n * it.pts, ok, n }; }
    case "order": { const n = it.ans.length, ok = it.ans.filter((id, k) => a[k] === id).length; return { s: ok / n * it.pts, ok, n }; }
    case "num": { const n = it.fields.length, ok = it.fields.filter(f => { const v = parseNum(a[f.id]), e = it.ans[f.id]; return !isNaN(v) && Math.abs(v - e.v) <= e.tol + 1e-9; }).length; return { s: ok / n * it.pts, ok, n }; }
    case "fill": { const n = it.blanks.length, ok = it.blanks.filter(b => a[b.id] === it.ans[b.id]).length; return { s: ok / n * it.pts, ok, n }; }
    case "tf": { const n = it.stmts.length, ok = it.stmts.filter(s => a[s.id] && a[s.id].v === it.ans[s.id]).length; return { s: ok / n * it.pts, ok, n }; }
    default: return { s: null };
  }

    $("#csv").onclick = () => { const L2 = [["Groupe", "Membres", ...STEPS.map(s => s.label + " /" + s.pts), "Total /20"], ...PUB.map(g => [g.id, g.members, ...STEPS.map(s => row(g.id, s.n).note ?? ""), tot(g.id)])]; const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + L2.map(r => r.map(c => `"${String(c).replace(".", ",")}"`).join(";")).join("\n")], { type: "text/csv" })); a.download = "MeltingPot_notes.csv"; a.click(); };
  }
  function tSeance() {
    shell(`<h1>Séance ${SESSION}</h1>
     <div class="panel" style="margin-top:14px"><h3>1. Lancer le parcours</h3><p class="lead">${info.started_at ? "Parcours lancé à " + new Date(info.started_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + ". L'étape 1 est ouverte pour tous les groupes." : "Les groupes attendent sur l'écran « Le parcours va commencer ». Un clic ouvre l'étape 1 pour tous."}</p>${info.started_at ? "" : `<button class="btn primary" id="go">Lancer le parcours pour tous</button>`}</div>
     <div class="panel" style="margin-top:14px"><h3>2. Escape game</h3><p class="lead">Il s'ouvre automatiquement pour un groupe quand vous validez son étape 6. Vous pouvez aussi l'ouvrir pour tous en même temps, par exemple 40 minutes avant la fin.</p><button class="btn ${info.escape_open ? "" : "primary"}" id="esc">${info.escape_open ? "Refermer l'escape game pour les groupes non validés" : "Ouvrir l'escape game pour tous"}</button></div>
     <div class="panel" style="margin-top:14px"><h3>PC des groupes</h3><p class="lead">Chaque groupe enregistre un seul PC pour les épreuves 1, 2 et l'escape game. Si un groupe doit changer de PC (panne, batterie), libérez-le ici.</p><div class="twrap"><table class="t">${PUB.map(g => `<tr><td><b>${g.id}</b> · ${esc(g.members)}</td><td>${devs.some(d => d.grp === g.id) ? "PC enregistré" : '<span class="hint">aucun PC</span>'}</td><td>${devs.some(d => d.grp === g.id) ? `<button class="btn" data-rel="${g.id}">Libérer</button>` : ""}</td></tr>`).join("")}</table></div></div>
     <div class="panel" style="margin-top:14px"><h3>3. Après un essai</h3><p class="lead">Efface le lancement, les dépôts, les fichiers enregistrés et les notes de la séance. Sur chaque appareil d'essai, rechargez la page puis changez de groupe.</p><button class="btn danger" id="rst">Réinitialiser la séance</button></div>`);
    document.querySelectorAll("[data-rel]").forEach(b => b.onclick = async () => { try { await rpc("mp_release", { p_code: SESSION, p_secret: secret, p_grp: b.dataset.rel }); devs = devs.filter(d => d.grp !== b.dataset.rel); toast(`PC du groupe ${b.dataset.rel} libéré.`); tSeance(); } catch (e) { toast("Échec."); } });
    const go = $("#go"); if (go) go.onclick = async () => { if (!go.dataset.a) { go.dataset.a = 1; go.textContent = "Confirmer le lancement"; return; } try { await rpc("mp_push_event", { p_code: SESSION, p_secret: secret, p_kind: "start", p_target: "", p_payload: {} }); await load(); tSeance(); } catch (e) { toast("Échec : vérifiez la connexion."); } };
    $("#esc").onclick = async () => { try { await rpc("mp_teacher_flags", { p_code: SESSION, p_secret: secret, p_escape: !info.escape_open }); await load(); tSeance(); } catch (e) { toast("Échec."); } };
    const r = $("#rst"); r.onclick = async () => { if (!r.dataset.a) { r.dataset.a = 1; r.textContent = "Confirmer : tout effacer"; return; } try { await rpc("mp_reset", { p_code: SESSION, p_secret: secret }); P = { rub: {}, seen: {} }; psave(); await load(); toast("Séance réinitialisée."); tSeance(); } catch (e) { toast("Échec."); } };
  }
  return { open };
})();

/* ---------- Démarrage ---------- */
window.addEventListener("hashchange", () => { if (location.hash !== "#prof") { $("#bar").hidden = false; } render(); });
if (S.group) refresh().then(render); else render();
</script>
</body>
